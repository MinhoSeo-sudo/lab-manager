<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구실 관리</title>
<style>
  :root{
    --accent:#4f46e5; --accent2:#7c3aed;
    --accent-soft:#eef1ff; --accent-border:#c9d2fe;
    --bg:#f4f5f9; --card:#ffffff;
    --border:#e7e9f0; --border2:#d7dae4;
    --text:#181a24; --muted:#69708a;
    --danger:#dc2626; --danger-soft:#fef1f1;
    --ok:#059669; --ok-soft:#e9faf2;
    --warn-soft:#fffbeb;
    --side-bg1:#181b2c; --side-bg2:#12141f;
    --sh-sm:0 1px 2px rgba(20,22,35,.05);
    --sh-md:0 6px 20px rgba(20,22,35,.08);
    --sh-lg:0 22px 60px rgba(20,22,35,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  ::selection{background:var(--accent-soft)}
  /* ---------- app layout: sidebar + shell ---------- */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:238px;flex-shrink:0;background:linear-gradient(180deg,var(--side-bg1),var(--side-bg2));color:#a7aec8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;gap:11px;align-items:center;padding:20px 18px 14px}
  .brand-logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 5px 14px rgba(79,70,229,.5);flex-shrink:0}
  .brand-t{font-weight:800;color:#fff;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
  .brand-s{font-size:8.5px;color:#697094;letter-spacing:.16em;margin-top:2.5px;font-weight:700}
  .side-nav{padding:2px 12px 10px;flex:1}
  .nav-sec{font-size:10.5px;color:#5b6180;font-weight:800;letter-spacing:.13em;padding:16px 11px 6px}
  .side-nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:#a7aec8;padding:9px 11px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;transition:background .14s,color .14s;letter-spacing:-.01em;margin-bottom:1px;position:relative}
  .side-nav button:hover{background:rgba(255,255,255,.06);color:#e8ebf7}
  .side-nav button.active{background:linear-gradient(90deg,rgba(99,102,241,.30),rgba(124,58,237,.14));color:#fff}
  .side-nav button.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--accent),var(--accent2))}
  .side-nav button svg{flex-shrink:0;opacity:.9}
  .side-nav button .pv{width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal;color:#c8cde4;flex-shrink:0;transition:all .14s}
  .side-nav button.active .pv{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .side-nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot{padding:13px 18px;font-size:10.5px;color:#5b6180;border-top:1px solid rgba(255,255,255,.07);line-height:1.6}
  .shell{flex:1;min-width:0;display:flex;flex-direction:column}
  /* ---------- top bar ---------- */
  header{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .page-title{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
  header .field{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .save-status{font-size:12px;color:var(--muted)}
  .save-status.err{color:var(--danger);font-weight:600}
  /* ---------- layout ---------- */
  main{padding:22px 24px 70px;max-width:1500px;width:100%;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh-sm)}
  /* stat tiles */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px 14px;box-shadow:var(--sh-sm)}
  .stat .sl{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center}
  .stat .sv{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.02em;color:var(--text)}
  .stat .su{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
  .stat .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  /* 비목별 잔액 */
  .budgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin:0 0 16px}
  .bstat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:12px 15px 13px;box-shadow:var(--sh-sm);border-left:4px solid var(--accent)}
  .bstat.low{border-left-color:#d97706}
  .bstat.over{border-left-color:var(--danger);background:#fffafa}
  .bstat.unset{border-left-color:#d7dae4;opacity:.75}
  .bstat .bl{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.01em}
  .bstat .bv{font-size:20px;font-weight:700;margin-top:3px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bstat.low .bv{color:#b45309}
  .bstat.over .bv{color:var(--danger)}
  .bstat .bu{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
  .bstat .bnone{font-size:14px;color:var(--muted);font-weight:600}
  .bstat .bd{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .bud-input{width:96px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 5px;font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:#3d4257}
  .bud-input:hover{border-color:var(--border2);background:#fff}
  .bud-input:focus{border-color:var(--accent);background:#fff}
  .bud-del{border:none;background:transparent;color:#c4c8d6;cursor:pointer;font-size:11px;padding:1px 4px;border-radius:5px;font-family:inherit;line-height:1}
  .bstat:hover .bud-del{color:#9aa0b4}
  .bud-del:hover{color:var(--danger);background:var(--danger-soft)}
  .bstat.badd{border-left-color:var(--border2);border-style:dashed;background:transparent;box-shadow:none;display:flex;flex-direction:column;justify-content:center}
  .badd-row{display:flex;gap:6px;margin-top:7px}
  .badd-input{flex:1;min-width:0;border:1px solid var(--border2);border-radius:7px;padding:5px 8px;font-size:12.5px;background:#fff}
  .badd-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  /* project header */
  .proj-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
  .proj-info label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:700;letter-spacing:.02em}
  .proj-info input{width:100%}
  .proj-title-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .proj-title-row .code{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-weight:600;letter-spacing:.01em}
  .proj-title-row input.pname{flex:1;min-width:260px;font-weight:700;font-size:15px}
  /* sub tabs */
  .subtabs{display:flex;gap:8px;margin:2px 0 16px}
  .subtabs button{border:1px solid var(--border2);background:#fff;padding:8px 20px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s;letter-spacing:-.01em}
  .subtabs button:hover{border-color:var(--accent-border);color:var(--accent)}
  .subtabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
  .subtabs button.active.bank{background:linear-gradient(135deg,#0e7490,#0891b2);box-shadow:0 4px 12px rgba(8,145,178,.3)}
  /* batch card */
  .batch{border:1px solid var(--border);border-radius:14px;margin-bottom:14px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm);transition:box-shadow .2s}
  .batch:hover{box-shadow:var(--sh-md)}
  .batch.rejected{border-color:#f3b4b4}
  .batch-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#fafbfe;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .batch.rejected .batch-head{background:var(--danger-soft)}
  .batch-head .toggle{cursor:pointer;border:none;background:transparent;font-size:12px;color:var(--muted);width:24px;font-family:inherit}
  .batch-head input.bname{font-weight:700;min-width:200px;flex:1}
  .batch-head .field{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
  .batch-head .field input[type=month]{width:130px}
  .batch-head .field input.reqno{width:150px}
  .badge{font-size:11.5px;border-radius:999px;padding:3.5px 10px;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
  .badge.sum{background:var(--accent-soft);color:var(--accent)}
  .badge.cnt{background:#f1f2f7;color:var(--muted)}
  .badge.rej{background:var(--danger);color:#fff}
  .badge.okb{background:var(--ok-soft);color:var(--ok)}
  .badge.ready{background:#e0edff;color:#1d4ed8}
  .badge.notready{background:#f1f2f7;color:#9ca3af}
  .reject-row{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--danger-soft);border-bottom:1px solid #fbd5d5;font-size:13px}
  .reject-row input.rreason{flex:1}
  .batch-body{padding:12px 14px;overflow-x:auto}
  /* entries table */
  table.entries{width:100%;border-collapse:collapse;font-size:13px;min-width:1340px}
  table.entries th{background:transparent;border-bottom:1.5px solid var(--border2);padding:7px 7px;font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:700;letter-spacing:.02em;text-align:left}
  table.entries th:first-child{text-align:center}
  table.entries td{border-bottom:1px solid #eef0f5;padding:3px 3px;vertical-align:middle}
  table.entries tbody tr{transition:background .12s}
  table.entries tbody tr:hover{background:#f8f9fd}
  table.entries td input{width:100%;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:7px}
  table.entries td input:hover{border-color:var(--border2)}
  table.entries td input:focus{border-color:var(--accent);background:#fff}
  table.entries td.num{text-align:right}
  table.entries td .amount{text-align:right;font-variant-numeric:tabular-nums}
  .ev-cell{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:2px 5px}
  .ev-cell label{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer;color:#3d4257}
  .ev-cell .etc-wrap{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
  .ev-cell input.evetc{flex:1;min-width:70px;border:1px solid var(--border2);border-radius:6px;padding:4px 7px;font-size:12px}
  .rowdel{border:none;background:transparent;color:#b6bac9;cursor:pointer;font-size:14px;padding:3px 7px;border-radius:6px;transition:all .12s;font-family:inherit}
  .rowdel:hover{color:var(--danger);background:var(--danger-soft)}
  tfoot td{background:transparent;font-weight:800;border-top:1.5px solid var(--border2);padding:8px 4px}
  /* inputs & buttons */
  input,select,textarea{border:1px solid var(--border2);border-radius:8px;padding:6.5px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;padding:0;cursor:pointer;box-shadow:none}
  /* 작성 체크박스는 다른 색(청록)으로 구분 */
  input.chk-written{accent-color:#0d9488;width:16px;height:16px}
  td.written-cell{background:#f0fdfa}
  tbody tr:hover td.written-cell{background:#e3f8f5}
  button.btn{border:1px solid var(--border2);background:#fff;border-radius:9px;padding:7.5px 14px;font-size:13px;cursor:pointer;font-weight:600;color:#3d4257;font-family:inherit;transition:all .15s;letter-spacing:-.01em}
  button.btn:hover{background:#f6f7fb;border-color:#c4c8d6}
  button.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28)}
  button.btn.primary:hover{filter:brightness(1.07);box-shadow:0 6px 16px rgba(79,70,229,.36)}
  button.btn.ghost-danger{color:var(--danger)}
  button.btn.ghost-danger:hover{background:var(--danger-soft);border-color:#f3b4b4}
  button.btn.small{padding:4.5px 11px;font-size:12px}
  .add-batch-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted)}
  /* suggestion dropdown */
  .sugg-pop{position:fixed;z-index:9999;background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:var(--sh-lg);padding:5px;display:none;max-height:250px;overflow-y:auto;overflow-x:hidden;min-width:130px;max-width:min(400px,calc(100vw - 16px));width:max-content}
  .sugg-pop.open{display:block}
  .sugg-item{padding:7.5px 13px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .1s;font-weight:500}
  .sugg-item:hover{background:var(--accent-soft);color:var(--accent);font-weight:600}
  /* 전체 view */
  table.overview{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  table.overview th{background:#f8f9fc;border-bottom:1.5px solid var(--border2);padding:7.5px 9px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em;text-align:left}
  table.overview td{border-bottom:1px solid #eef0f5;padding:7.5px 9px}
  table.overview tr.rej td{background:var(--danger-soft)}
  details.ov-batch{border:1px solid var(--border);border-radius:13px;margin-bottom:10px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm);transition:box-shadow .2s}
  details.ov-batch:hover{box-shadow:var(--sh-md)}
  details.ov-batch summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 15px;flex-wrap:wrap;transition:background .12s}
  details.ov-batch summary:hover{background:#fafbfe}
  details.ov-batch summary::-webkit-details-marker{display:none}
  details.ov-batch summary .arrow{color:#b6bac9;font-size:10px;transition:transform .15s}
  details.ov-batch[open] summary .arrow{transform:rotate(90deg)}
  details.ov-batch.rejected{border-color:#f3b4b4}
  details.ov-batch.rejected summary{background:var(--danger-soft)}
  details.ov-batch.applied{opacity:.58}
  details.ov-batch.applied:hover{opacity:1}
  .ov-body{padding:2px 15px 14px}
  .kind-tag{font-size:11px;font-weight:800;border-radius:6px;padding:2.5px 8px;letter-spacing:.01em}
  .kind-tag.rnd{background:var(--accent-soft);color:var(--accent)}
  .kind-tag.bank{background:#e3f6fa;color:#0e7490}
  .proj-tag{font-size:12px;color:var(--muted);font-weight:600}
  .ov-apply{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--border2);border-radius:999px;padding:3.5px 11px;background:#fff;white-space:nowrap;transition:all .15s}
  .ov-apply:hover{border-color:var(--accent-border)}
  .ov-apply.on{background:var(--ok-soft);border-color:#9fe7c8;color:var(--ok)}
  .month-tag{font-size:11.5px;background:#f1f2f7;border-radius:6px;padding:2.5px 8px;color:#565d78;font-weight:600}
  .ov-title{font-weight:700;letter-spacing:-.01em}
  .ov-divider{margin:18px 0 10px;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
  .ov-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .empty{color:var(--muted);text-align:center;padding:44px 0;font-size:13.5px;border:1.5px dashed var(--border2);border-radius:14px;background:rgba(255,255,255,.6)}
  /* readme */
  .readme{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px 32px;max-width:900px;line-height:1.8;box-shadow:var(--sh-sm)}
  .readme h2{margin-top:0;font-size:19px;letter-spacing:-.02em}
  .readme h3{margin-top:24px;font-size:15px;color:var(--accent);letter-spacing:-.01em}
  .readme code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:12.5px}
  .readme li{margin-bottom:6px}
  h2.section{font-size:16px;margin:4px 0 14px;letter-spacing:-.02em}
  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(18,20,32,.5);backdrop-filter:blur(3px);z-index:50;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:18px;padding:24px 26px;width:100%;max-width:660px;box-shadow:var(--sh-lg)}
  .modal h3{margin:0 0 6px;font-size:17px;letter-spacing:-.02em}
  .modal h4{margin:20px 0 8px;font-size:13.5px;color:var(--accent)}
  .modal textarea{width:100%;height:110px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;resize:vertical;line-height:1.55}
  .modal .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .modal .note{background:var(--warn-soft);border:1px solid #fbe3a3;color:#8a5a10;border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.65;margin:8px 0 0}
  .modal .note.danger-note{background:var(--danger-soft);border-color:#f3b4b4;color:#991b1b}
  .msg{font-size:12.5px;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}
  .modal ol.guide{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.9}
  .modal code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:12px}
  .modal a{color:var(--accent);font-weight:600}
  .sync-chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
  .sync-chip:hover{filter:brightness(.95)}
  .sync-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
  .sync-chip.off{background:#f1f2f7;color:#9ca3af}
  .sync-chip.on{background:var(--ok-soft);color:var(--ok)}
  .sync-chip.warn{background:var(--warn-soft);color:#b45309}
  .sync-chip.err{background:var(--danger-soft);color:var(--danger)}
  .attach-btn{border:1px solid transparent;background:transparent;color:#8a90a8;cursor:pointer;font-size:13px;padding:4px 8px;border-radius:7px;font-family:inherit;font-weight:700;white-space:nowrap;transition:all .12s}
  .attach-btn:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-soft)}
  .attach-btn.has{color:var(--accent)}
  .attach-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px}
  .attach-item .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .attach-item .ap{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 드래그앤드롭 */
  .dropzone{border:2px dashed var(--border2);border-radius:12px;padding:20px 16px;text-align:center;background:#fafbfe;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
  .dropzone.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
  .dropzone .dz-icon{font-size:20px;color:var(--accent);line-height:1}
  tr.drop-target td{background:var(--accent-soft) !important;box-shadow:inset 0 0 0 1.5px var(--accent-border)}
  /* 폴더 탐색 */
  .crumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 10px;color:var(--muted)}
  .crumbs button{border:none;background:var(--bg);color:var(--accent);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:7px;cursor:pointer;font-family:inherit}
  .crumbs button:hover{background:var(--accent-soft)}
  .crumbs span.sep{color:#c4c8d6}
  .browse-list{border:1px solid var(--border);border-radius:11px;max-height:340px;overflow:auto}
  .browse-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid #eef0f5;font-size:13px;cursor:pointer;transition:background .1s}
  .browse-row:last-child{border-bottom:none}
  .browse-row:hover{background:var(--accent-soft)}
  .browse-row .bi{width:18px;text-align:center;flex-shrink:0}
  .browse-row .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .browse-row .bs{font-size:11.5px;color:var(--muted);flex-shrink:0}
  .browse-empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  .path-box{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;flex-wrap:wrap}
  .path-box code{flex:1;min-width:200px;font-size:11.5px;word-break:break-all;background:transparent;border:none;padding:0;color:#3d4257}
  /* narrow screens: sidebar becomes top strip */
  @media (max-width:920px){
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:column}
    .side-nav{display:flex;overflow-x:auto;padding:4px 10px 10px;gap:4px}
    .side-nav button{width:auto;flex-shrink:0}
    .nav-sec,.side-foot{display:none}
    header{top:0}
  }
  @media print{ .sidebar,header,.subtabs{display:none} }

  /* ================= LabHub 공통 ================= */
  [hidden]{display:none !important}
  .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;background:var(--bg)}
  .side-nav button .cnt{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;font-weight:800;padding:1px 7px}
  .side-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
  .side-user .su-info{flex:1;min-width:0}
  .side-user .su-name{color:#fff;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-user .su-role{font-size:11px;color:#8890b0}
  .side-user button{border:none;background:rgba(255,255,255,.08);color:#c8cde4;border-radius:8px;padding:6px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .side-user button:hover{background:rgba(255,255,255,.16);color:#fff}
  .avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0;position:relative}
  .avatar.sm{width:24px;height:24px;font-size:10.5px}
  .avatar .pdot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
  .sidebar .avatar .pdot{border-color:#161827}
  .mode-chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .mode-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
  .mode-chip.on{background:var(--ok-soft);color:var(--ok)}
  .mode-chip.off{background:var(--warn-soft);color:#b45309}
  .mode-chip.demo{background:#f1f2f7;color:#6b7280}
  #hdrExtra{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1f2233;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:99999;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .card h3{margin:0 0 12px;font-size:14.5px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .card h3 .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eef0f5;font-size:13px}
  .li:last-child{border-bottom:none}
  .li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .li.click{cursor:pointer;border-radius:8px}
  .li.click:hover{background:#f8f9fd}
  .dday{font-size:11px;font-weight:800;border-radius:6px;padding:2.5px 7px;white-space:nowrap;background:#f1f2f7;color:#565d78;font-variant-numeric:tabular-nums}
  .dday.hot{background:var(--danger);color:#fff}
  .dday.warm{background:#fff1dc;color:#b45309}
  .dday.done{background:var(--ok-soft);color:var(--ok)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#f1f2f7;color:#565d78;white-space:nowrap}
  .chip.accent{background:var(--accent-soft);color:var(--accent)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.warn{background:#fff1dc;color:#b45309}
  .chip.danger{background:var(--danger-soft);color:var(--danger)}
  .chip.sel{cursor:pointer;border:1px solid var(--border2);background:#fff}
  .chip.sel.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .sp{flex:1}
  .seg{display:inline-flex;border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:none;background:transparent;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
  .seg button+button{border-left:1px solid var(--border2)}
  .seg button.on{background:var(--accent);color:#fff}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 9px;border-bottom:1.5px solid var(--border2);white-space:nowrap;letter-spacing:.02em}
  table.tbl td{padding:8px 9px;border-bottom:1px solid #eef0f5;vertical-align:middle}
  table.tbl tr.click{cursor:pointer}
  table.tbl tr.click:hover td{background:#f8f9fd}
  .tbl-wrap{overflow-x:auto}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .nowrap{white-space:nowrap}
  .ro-note{background:#f1f2f7;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#565d78;margin-bottom:14px}
  /* form */
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .form .full{grid-column:1/-1}
  .form label.fl{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{width:100%}
  .form textarea{min-height:90px;resize:vertical;font-family:inherit;font-size:13.5px;line-height:1.6}
  .form .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .form .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}

  .modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;align-items:center}

  .modal.wide{max-width:860px}
  /* auth */
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;background:radial-gradient(1200px 600px at 10% -10%,#e7e9ff,transparent),radial-gradient(900px 500px at 110% 110%,#f1e8ff,transparent),var(--bg)}
  .auth-card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--sh-lg);padding:30px 30px 26px;width:100%;max-width:430px}

  .auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .auth-brand .brand-logo{width:42px;height:42px;font-size:19px}
  .auth-brand h1{margin:0;font-size:19px;letter-spacing:-.03em}
  .auth-brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .auth-card .fld{margin-bottom:11px}
  .auth-card .fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .auth-card .fld input,.auth-card .fld select{width:100%;padding:10px 12px;font-size:14px}
  .auth-card .btn.full{width:100%;padding:11px;font-size:14px;margin-top:4px}
  .auth-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
  .auth-sep::before,.auth-sep::after{content:'';flex:1;height:1px;background:var(--border)}
  .auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
  .auth-links a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
  .auth-msg{font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  .auth-msg.err{color:var(--danger)} .auth-msg.ok{color:var(--ok)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .choice button{border:1.5px solid var(--border2);background:#fff;border-radius:14px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;transition:all .15s}
  .choice button:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
  .choice b{display:block;font-size:14px;margin-bottom:4px;color:var(--text)}
  .choice span{font-size:12px;color:var(--muted);line-height:1.5}
  @media (max-width:640px){ .choice{grid-template-columns:1fr} }
  /* dashboard */
  .hello{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .hello h2{margin:0;font-size:20px;letter-spacing:-.03em}
  .hello .d{color:var(--muted);font-size:13px;margin-top:2px}
  .alert{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:12px;border:1px solid}
  .alert.warn{background:var(--warn-soft);border-color:#fbe3a3;color:#8a5a10}
  .alert.info{background:var(--accent-soft);border-color:var(--accent-border);color:#3730a3}
  .alert.danger{background:var(--danger-soft);border-color:#f3b4b4;color:#991b1b}
  .alert .btn{margin-left:auto}
  /* presence */
  .pres-btns{display:flex;gap:6px;flex-wrap:wrap}
  .pres-btn{border:1.5px solid var(--border2);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;color:#3d4257}
  .pres-btn i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .pres-btn.on{border-color:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
  .pres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .pres-card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:12px 14px;display:flex;gap:11px;align-items:center;border-left:4px solid #d7dae4}
  .pres-card .pn{font-weight:700;font-size:13.5px}
  .pres-card .ps{font-size:12px;font-weight:700;margin-top:1px}
  .pres-card .pm{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pres-card.stale{opacity:.55}
  /* calendar */
  .cal{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm)}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfe;border-bottom:1px solid var(--border)}
  .cal-head div{padding:8px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
  .cal-head div:first-child,.cal-day.sun .dn{color:#dc2626}
  .cal-head div:last-child,.cal-day.sat .dn{color:#2563eb}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-day{min-height:108px;border-right:1px solid #eef0f5;border-bottom:1px solid #eef0f5;padding:5px 5px 6px;cursor:pointer;transition:background .1s;min-width:0}
  .cal-day:nth-child(7n){border-right:none}
  .cal-day:hover{background:#fafbff}
  .cal-day.other{background:#fbfbfd}
  .cal-day.other .dn{opacity:.4}
  .cal-day .dn{font-size:12px;font-weight:700;padding:2px 5px;display:inline-block;border-radius:7px}
  .cal-day.today .dn{background:var(--accent);color:#fff !important}
  .cal-day .hol{font-size:10.5px;color:#dc2626;margin-left:3px;font-weight:600}
  .ev{display:block;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid transparent}
  .ev:hover{filter:brightness(.96)}
  .ev.lab{font-weight:700;color:#fff;padding-top:3px;padding-bottom:3px;box-shadow:0 1px 2px rgba(20,22,40,.18)}
  .ev.lab b{color:#fff !important}
  .ev.sub{font-weight:500;font-size:11px}
  .ev.done{opacity:.5;text-decoration:line-through}
  .ev.more{background:transparent;color:var(--muted);padding-left:6px}
  .cal-legend{display:flex;gap:6px;flex-wrap:wrap}
  @media (max-width:760px){ .cal-day{min-height:70px} .ev{font-size:10px;padding:1px 3px} }
  /* timetable */
  .tt-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-sm)}

  .tt .h{background:#fafbfe;font-weight:800;text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);border-right:1px solid #eef0f5;font-size:14px}
  .tt .h.today{background:var(--accent-soft);color:var(--accent)}
  .tt .sh{font-size:10.5px;font-weight:700;color:#fff;text-align:center;padding:4px 2px;border-right:1px solid rgba(255,255,255,.4)}
  .tt .sh.prof{background:#7c5cbf}.tt .sh.grad{background:#3b6fb6}.tt .sh.ug{background:#2f8f6a}
  .tt .ph{background:#fafbfe;text-align:center;border-right:1px solid var(--border);border-bottom:1px solid #eef0f5;display:flex;flex-direction:column;justify-content:center;padding:4px}
  .tt .ph b{font-size:15px}
  .tt .ph span{font-size:10px;color:var(--muted)}
  .tt .ph.now{background:var(--accent-soft)}
  .tt .c{border-right:1px solid #eef0f5;border-bottom:1px solid #eef0f5;padding:5px 3px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:62px;line-height:1.35}
  .tt .c.prof{background:#faf8fd}.tt .c.grad{background:#f6f9fe}.tt .c.ug{background:#f5fbf8}
  .tt .c.daylast{border-right:1.5px solid var(--border2)}
  .tt .c .nm{font-weight:600;color:#2a2f45;border-radius:4px;padding:0 3px}
  .tt .c .nm.hl{background:#fde68a;color:#78350f}
  .tt .c .nm.me{background:var(--accent);color:#fff}
  .tt .c.free{background:#dcfce7 !important;box-shadow:inset 0 0 0 2px #22c55e}
  .tt .c.busy{opacity:.35}
  .tt .c.edit{cursor:pointer}
  .tt .c.edit:hover{box-shadow:inset 0 0 0 2px var(--accent-border)}
  .tt .blk{border-radius:6px;margin:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:11.5px;padding:6px;line-height:1.45;white-space:pre-line}
  .tt .blk.meet{background:#f3e3d6;color:#7c3a12;border:1px solid #e7c3a6}
  .tt .blk.class{background:#ede4fb;color:#5b2a9e;border:1px solid #d6c3f5}
  .tt .blk.lab{background:#fde7d9;color:#9a3412;border:1px solid #f8c6a6}
  .tt .blk.etc{background:#e5e7eb;color:#374151;border:1px solid #d1d5db}
  .tt .blk.now{box-shadow:0 0 0 2px var(--accent)}
  .tt .blk.edit{cursor:pointer}
  .tt .row-now{background:var(--accent-soft)}
  .name-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  /* misc */
  .notice{border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px 17px;margin-bottom:10px;box-shadow:var(--sh-sm);cursor:pointer;transition:box-shadow .15s}

  .notice.pinned{border-color:var(--accent-border);background:linear-gradient(0deg,#fff,#fbfbff)}
  .notice .nt{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center}
  .notice .nm{font-size:12px;color:var(--muted);margin-top:4px}
  .notice .nb{font-size:13px;color:#3d4257;margin-top:8px;white-space:pre-wrap;line-height:1.7;max-height:4.9em;overflow:hidden}
  .notice.unread .nt::after{content:'NEW';font-size:10px;font-weight:800;background:var(--danger);color:#fff;border-radius:5px;padding:1px 6px}
  .prewrap{white-space:pre-wrap;line-height:1.75;font-size:13.5px}
  .prewrap a{color:var(--accent)}
  .eq-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--sh-sm);cursor:pointer;transition:all .15s}
  .eq-card:hover{box-shadow:var(--sh-md)}
  .eq-card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .eq-card .en{font-weight:700;font-size:14px}
  .eq-card .em{font-size:12px;color:var(--muted);margin-top:4px}
  .qty{display:inline-flex;align-items:center;gap:4px}

  .qty b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
  .ai-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}

/* ---------------- 공통 유틸 ---------------- */
const $ = (s, el) => (el || document).querySelector(s);

function stableJSON(v){
  if(v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if(Array.isArray(v)) return '[' + v.map(stableJSON).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stableJSON(v[k])).join(',') + '}';
}
const pad2 = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
const DOW = ['일','월','화','수','목','금','토'];
const fmtDate = s => { if(!s) return ''; const d = parseYmd(s); return (d.getMonth()+1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')'; };
const fmtDateLong = s => { if(!s) return ''; const d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; };
function fmtTs(ts){ if(!ts) return ''; const d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function ago(ts){
  if(!ts) return ''; const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return '방금'; if(s < 3600) return Math.floor(s/60) + '분 전'; if(s < 86400) return Math.floor(s/3600) + '시간 전';
  return Math.floor(s/86400) + '일 전';
}
function ddayInfo(dateStr, done){
  const n = diffDays(dateStr, todayStr());
  const label = n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n);
  const cls = done ? 'done' : (n <= 3 && n >= 0) ? 'hot' : (n <= 7 && n > 0) ? 'warm' : n < 0 ? '' : '';
  return { n, label, cls };
}
/* 링크는 http(s)만 허용 — javascript: 같은 주소가 클릭 가능한 링크로 들어가지 않도록 */
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777','#2563eb','#65a30d','#ea580c','#0d9488','#9333ea'];
function hashColor(s){ let h = 0; for(const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function avatar(name, color, cls, dot){
  const n = String(name || '?').trim();
  const ini = /^[가-힣]/.test(n) ? n.slice(-2) : n.slice(0,2).toUpperCase();
  return '<span class="avatar ' + (cls||'') + '" style="background:' + (color || hashColor(n)) + '">' + esc(ini) +

function toast(msg, err){

}

  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/json' });

  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function pickJSONFile(){
  return new Promise((res, rej) => {
    const inp = $('#hiddenFile'); inp.value = '';

      r.onerror = () => rej(r.error); r.readAsText(f);

    inp.click();

}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }

    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';

    document.body.removeChild(ta); return ok;
  }
}
function errMsg(e){

    'auth/wrong-password':'비밀번호가 틀렸습니다.', 'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.',

const ROLES = { admin:'관리자', grad:'대학원생', intern:'학부연구생', viewer:'열람전용', pending:'승인대기' };

const ALL = ['admin','grad','intern','viewer'];
const ICON = {

/* --- 체험 모드: 이 브라우저(localStorage)에만 저장 --- */
function makeDemoBackend(){
  const KEY = 'labhub-demo-db-v1';
  let db = {};
  try{ db = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ db = {}; }
  const ls = [];
  let saveT = null;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => {
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('브라우저 저장 공간이 부족합니다 — 백업 후 정리하세요', true); }
  }, 120); };
  const match = (w, d) => !w || (w[1] === '==' ? d[w[0]] === w[2] : true);
  function notify(coll, id, before, after){
    for(const l of ls){
      if(l.coll !== coll) continue;
      if(l.docId){ if(l.docId === id) setTimeout(() => l.cb(after ? clone(after) : null, true), 0); continue; }
      const a = before && match(l.where, before), b = after && match(l.where, after);
      const type = (!a && b) ? 'added' : (a && b) ? 'modified' : (a && !b) ? 'removed' : null;
      if(type){ const data = clone(after || before); setTimeout(() => l.cb([{ type, id, data }], true), 0); }
    }
  }
  function write(coll, id, data){
    const before = db[coll] && db[coll][id] ? clone(db[coll][id]) : null;
    db[coll] = db[coll] || {};
    if(data === null) delete db[coll][id]; else db[coll][id] = clone(data);
    save(); notify(coll, id, before, data);
  }
  return {
    watchColl(coll, cb, where){
      const l = { coll, cb, where }; ls.push(l);
      const docs = db[coll] || {};
      const ch = Object.keys(docs).filter(id => match(where, docs[id])).map(id => ({ type:'added', id, data: clone(docs[id]) }));
      setTimeout(() => cb(ch, false), 0);
      return () => { const i = ls.indexOf(l); if(i >= 0) ls.splice(i, 1); };
    },
    watchDoc(coll, id, cb){
      const l = { coll, docId:id, cb }; ls.push(l);
      setTimeout(() => cb(db[coll] && db[coll][id] ? clone(db[coll][id]) : null, false), 0);
      return () => { const i = ls.indexOf(l); if(i >= 0) ls.splice(i, 1); };
    },
    async get(coll, id){ return db[coll] && db[coll][id] ? clone(db[coll][id]) : null; },
    async list(coll){ const d = db[coll] || {}; return Object.keys(d).map(id => ({ id, data: clone(d[id]) })); },
    async set(coll, id, data, merge){ const cur = (db[coll] || {})[id]; write(coll, id, merge && cur ? Object.assign(clone(cur), clone(data)) : data); },
    async update(coll, id, patch){ const cur = (db[coll] || {})[id]; if(!cur) throw new Error('not-found'); write(coll, id, Object.assign(clone(cur), clone(patch))); },
    async del(coll, id){ write(coll, id, null); },
    async batch(ops){ for(const o of ops){ if(o.op === 'del') await this.del(o.coll, o.id); else if(o.op === 'update') await this.update(o.coll, o.id, o.data); else await this.set(o.coll, o.id, o.data, o.merge); } },
    newId: () => uid(),
    wipe(){ db = {}; try{ localStorage.removeItem(KEY); }catch(e){} }
  };
}

/* --- Firebase 모드: Auth + Firestore (실시간·오프라인 캐시) --- */
async function makeFireBackend(cfg){
  const [A, AM, F] = await Promise.all([
    import(SDK_BASE + 'firebase-app.js'), import(SDK_BASE + 'firebase-auth.js'), import(SDK_BASE + 'firebase-firestore.js')
  ]);
  const app = A.initializeApp(cfg);
  const auth = AM.getAuth(app);
  let db;
  try{
    db = F.initializeFirestore(app, { ignoreUndefinedProperties: true,
      localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  }catch(e){ db = F.getFirestore(app); }
  if(window.LABHUB_EMULATOR){ F.connectFirestoreEmulator(db, '127.0.0.1', 8080); AM.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings:true }); }
  const dref = (c, id) => F.doc(db, c, id);
  const snapErr = (what, err) => { console.warn('snapshot', what, err); if(String(err.code).includes('permission')) return; toast('동기화 오류(' + what + '): ' + errMsg(err), true); };
  const be = {
    watchColl(coll, cb, where){
      let q = F.collection(db, coll);
      if(where) q = F.query(q, F.where(where[0], where[1], where[2]));
      return F.onSnapshot(q, snap => cb(snap.docChanges().map(c => ({ type:c.type, id:c.doc.id, data:c.doc.data() })), snap.metadata.hasPendingWrites), err => snapErr(coll, err));
    },
    watchDoc(coll, id, cb){ return F.onSnapshot(dref(coll, id), s => cb(s.exists() ? s.data() : null, s.metadata.hasPendingWrites), err => snapErr(coll + '/' + id, err)); },
    async get(coll, id){ const s = await F.getDoc(dref(coll, id)); return s.exists() ? s.data() : null; },
    async list(coll){ const s = await F.getDocs(F.collection(db, coll)); return s.docs.map(d => ({ id:d.id, data:d.data() })); },
    set(coll, id, data, merge){ return F.setDoc(dref(coll, id), data, merge ? { merge:true } : {}); },
    update(coll, id, patch){ return F.updateDoc(dref(coll, id), patch); },
    del(coll, id){ return F.deleteDoc(dref(coll, id)); },
    async batch(ops){
      /* 보안 규칙의 문서 조회 한도(배치당 20회)를 넘지 않도록 8건씩 나눠 커밋 */
      for(let i = 0; i < ops.length; i += 8){
        const b = F.writeBatch(db);
        for(const o of ops.slice(i, i + 8)){
          const r = dref(o.coll, o.id);
          if(o.op === 'del') b.delete(r); else if(o.op === 'update') b.update(r, o.data); else b.set(r, o.data, o.merge ? { merge:true } : {});
        }
        await b.commit();
      }
    },
    newId: () => F.doc(F.collection(db, '_ids')).id
  };
  const au = {
    onChange(cb){ AM.onAuthStateChanged(auth, cb); },
    signIn: (e, p) => AM.signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => AM.createUserWithEmailAndPassword(auth, e, p),
    google: () => AM.signInWithPopup(auth, new AM.GoogleAuthProvider()),
    reset: e => AM.sendPasswordResetEmail(auth, e),
    signOut: () => AM.signOut(auth),
    current: () => auth.currentUser
  };
  return { be, au };
}

/* 쓰기 래퍼 — 실패 시 알림. (Firebase는 오프라인이어도 로컬에 먼저 반영되고 재연결 시 전송) */
let pendingWrites = 0;
function setSaveStatus(t, err){ const el = $('#saveStatus'); if(!el) return; el.textContent = t; el.className = 'save-status' + (err ? ' err' : ''); }
function track(p, okMsg){
  pendingWrites++; setSaveStatus('저장 중…');
  return Promise.resolve(p).then(r => {
    pendingWrites--; if(!pendingWrites) setSaveStatus((okMsg || '저장됨') + ' · ' + new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }));
    return r;
  }).catch(e => {
    pendingWrites--; setSaveStatus('저장 실패', true); toast('저장 실패: ' + errMsg(e), true); throw e;
  });
}
const dbSet = (c, id, d, merge) => track(BE.set(c, id, d, merge));
const dbUpdate = (c, id, d) => track(BE.update(c, id, d));

function openModal(o){

  bg.className = 'modal-bg open';
  bg.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '"><h3>' + esc(o.title || '') + '</h3>' +
    (o.sub ? '<div class="hint" style="margin-bottom:12px">' + o.sub + '</div>' : '') +
    '<div class="mbody">' + (o.body || '') + '</div><div class="mfoot"></div></div>';
  const foot = $('.mfoot', bg);
  const m = { el: bg, close(){ bg.remove(); document.removeEventListener('keydown', onKey); if(o.onClose) o.onClose(); } };
  (o.buttons || [{ label:'닫기' }]).forEach(b => {
    if(!b) return;
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || '') + (b.left ? ' left' : '');
    btn.textContent = b.label;
    btn.onclick = async () => {
      if(b.confirm && !(await confirmBox(b.confirm, b.label, true))) return;
      if(b.onClick){ try{ const r = await b.onClick(m); if(r === false) return; }catch(e){ toast(errMsg(e), true); return; } }
      m.close();
    };
    foot.appendChild(btn);
  });
  const onKey = e => { if(e.key === 'Escape' && document.body.lastElementChild === bg) m.close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', e => { if(e.target === bg) bg._down = true; });
  bg.addEventListener('click', e => { if(e.target === bg && bg._down && !o.sticky) m.close(); bg._down = false; });
  document.body.appendChild(bg);
  if(o.onMount) o.onMount(bg, m);
  const first = $('input:not([type=checkbox]):not([type=hidden]),textarea', $('.mbody', bg));
  if(first && !o.noFocus) setTimeout(() => first.focus(), 30);
  return m;
}
function confirmBox(msg, okLabel, danger){
  return new Promise(res => {
    let done = false;
    openModal({ title:'확인', body:'<div style="font-size:13.5px;line-height:1.7">' + msg + '</div>', noFocus:true,
      onClose: () => { if(!done) res(false); },
      buttons:[ { label:'취소' }, { label: okLabel || '확인', cls: danger ? 'primary ghost-danger' : 'primary', onClick: () => { done = true; res(true); } } ] });
  });
}

function readForm(el){
  const o = {};

    const n = i.name;
    if(i.type === 'checkbox' && i.dataset.multi !== undefined){ (o[n] = o[n] || []); if(i.checked) o[n].push(i.value); }
    else if(i.type === 'checkbox') o[n] = i.checked;
    else if(i.type === 'radio'){ if(i.checked) o[n] = i.value; }
    else o[n] = i.value.trim();
  });

/* ---------------- 사람/명단 ---------------- */
function roster(){ return (S.app && Array.isArray(S.app.roster)) ? S.app.roster : []; }
function rosterNames(groups){ return roster().filter(r => !groups || groups.includes(r.group)).map(r => r.name); }
function personColor(name){
  const r = roster().find(x => x.name === name); if(r && r.color) return r.color;
  const u = vals(S.users).find(x => x.name === name); if(u && u.color) return u.color;
  return hashColor(name);
}
function userName(uidv){ const u = S.users[uidv]; return u ? u.name : '(알 수 없음)'; }
function namePicker(name, selected, extra){
  const names = Array.from(new Set(rosterNames().concat(extra || [])));
  if(!names.length) return '<div class="hint">구성원·권한 메뉴에서 명단을 먼저 등록하세요.</div>';
  return '<div class="name-picker">' + names.map(n =>
    '<label class="chip sel' + ((selected || []).includes(n) ? ' on' : '') + '"><input type="checkbox" data-multi name="' + name + '" value="' + esc(n) + '"' +
    ((selected || []).includes(n) ? ' checked' : '') + ' style="display:none">' + esc(n) + '</label>').join('') + '</div>';
}
document.addEventListener('change', e => {
  const i = e.target; if(i.type === 'checkbox' && i.closest('.name-picker')) i.closest('label').classList.toggle('on', i.checked);
});

const PRESENCE = [
  { k:'in',      label:'재실', color:'#16a34a' },
  { k:'class',   label:'수업', color:'#2563eb' },
  { k:'meeting', label:'회의', color:'#7c3aed' },
  { k:'out',     label:'외출', color:'#ea580c' },
  { k:'trip',    label:'출장', color:'#0891b2' },
  { k:'leave',   label:'휴가', color:'#a3a3a3' },
  { k:'home',    label:'퇴근', color:'#6b7280' }
];
const PRES_BY = Object.fromEntries(PRESENCE.map(p => [p.k, p]));
function presenceOf(u){
  const p = u && u.presence; if(!p || !PRES_BY[p.state]) return null;
  const stale = !p.at || ymd(new Date(p.at)) !== todayStr();
  return Object.assign({}, PRES_BY[p.state], { msg: p.msg || '', at: p.at, stale });
}
function setMyPresence(state, msg){
  if(!ME) return;
  const presence = { state, msg: msg == null ? ((ME.presence && ME.presence.msg) || '') : msg, at: Date.now() };
  ME.presence = presence;
  if(S.users[ME.uid]) S.users[ME.uid].presence = presence;
  dbUpdate('users', ME.uid, { presence }).catch(() => {});
  scheduleRender();
}

  else{
    try{ const r = await makeFireBackend(cfg); BE = r.be; AU = r.au; }

      return;

async function createProfile(user){
  const name = signupName || user.displayName || String(user.email || '사용자').split('@')[0];
  const base = { name, email: user.email || '', role:'pending', position:'', color: hashColor(name), createdAt: Date.now() };
  if(MODE === 'demo'){ base.role = demoRole || 'admin'; await BE.set('users', user.uid, base); return; }
  let boot = null;
  try{ boot = await BE.get('meta', 'bootstrap'); }catch(e){ boot = null; }
  if(!boot){
    try{
      await BE.batch([{ op:'set', coll:'users', id:user.uid, data: Object.assign({}, base, { role:'admin' }) },
                      { op:'set', coll:'meta', id:'bootstrap', data:{ uid:user.uid, at:Date.now() } }]);
      return;
    }catch(e){ console.warn('bootstrap failed', e); }
  }
  await BE.set('users', user.uid, base);
}
async function onAuthUser(user){
  if(meUnsub){ try{ meUnsub(); }catch(e){} meUnsub = null; }
  teardownApp();
  if(!user){ ME = null; showLogin(); return; }
  showBoot('계정 확인 중…');
  try{
    const prof = await BE.get('users', user.uid);
    if(!prof) await createProfile(user);
    else if(MODE === 'demo' && demoRole && prof.role !== demoRole) await BE.update('users', user.uid, { role: demoRole });
  }catch(e){
    console.error(e);
    showFatal('계정 정보를 읽지 못했습니다',
      'Firestore 데이터베이스가 만들어졌는지, <b>보안 규칙</b>을 가이드대로 게시했는지 확인하세요 (가이드 2·5단계).<br><span class="muted small">' + esc(errMsg(e)) + '</span>' +
      '<div style="margin-top:10px"><button class="btn small" onclick="AU.signOut()">로그아웃</button></div>');
    return;
  }
  meUnsub = BE.watchDoc('users', user.uid, d => {
    if(!d){ ME = { uid:user.uid, name: user.displayName || user.email, email:user.email, role:'pending' }; showPending(); return; }
    if(PREVIEW) return;
    const prevRole = ME && ME.role;
    ME = Object.assign({}, d, { uid:user.uid, email: d.email || user.email || '' });
    if(!isMember()){ showPending(); return; }
    if(!APP_STARTED) startApp();
    else if(prevRole !== ME.role){ syncSubscriptions(); render(); }
    else scheduleRender();
  });
}
function defaultApp(){
  const grp = { admin:'교수', grad:'대학원생', intern:'학부생', viewer:'기타' }[ME.role] || '기타';
  return { labName:'연구실', perms: clone(DEFAULT_PERMS), roster: ME ? [{ name: ME.name, group: grp, color: ME.color || hashColor(ME.name) }] : [],
           semester:'2026-2', createdAt: Date.now() };

function startApp(){
  APP_STARTED = true;
  $('#authScreen').hidden = true; hideBoot(); $('#appLayout').hidden = false;
  sub('settings', () => BE.watchDoc('settings', 'app', d => {
    S.app = d; S.appLoaded = true;
    if(isAdmin()){
      if(!d) dbSet('settings', 'app', defaultApp()).catch(() => {});
      else if(Object.keys(DEFAULT_PERMS).some(k => !(d.perms && d.perms[k]))) dbSet('settings', 'app', { perms: perms() }, true).catch(() => {});
    }
    applyBrand(); syncSubscriptions(); scheduleRender();
  }));
  sub('presentation', () => BE.watchDoc('settings', 'presentation', d => { S.presentation = d; scheduleRender(); }));
  sub('users', () => BE.watchColl('users', collInto(S.users)));
  sub('planner', () => BE.watchColl('planner', collInto(S.planner, () => Planner.migrate()), ['uid', '==', ME.uid]));   /* 내 플래너: 본인 것만 내려받음 */
  setRouteFromHash(); render();
  if(isAdmin()) setTimeout(() => Backup.autoSnapshot(), 8000);
}

function navBadge(k){
  if(k === 'notices') return vals(S.notices).filter(n => !(n.readBy || []).includes(ME.uid)).length;
  if(k === 'admin') return vals(S.users).filter(u => u.role === 'pending').length;
  if(k === 'suggest' && canEdit('suggest')) return vals(S.suggestions).filter(x => x.status === '접수').length;
  if(k === 'equipment' && canEdit('equipment')) return vals(S.purchases).filter(p => p.status === '요청').length;

function renderNav(){

window.addEventListener('online', () => APP_STARTED && renderModeChip());

function render(){
  if(!ME || !APP_STARTED) return;
  renderPending = false;
  if(!canView(ROUTE)) ROUTE = 'dashboard';
  const M = MOD[ROUTE];
  renderNav(); renderSideUser(); renderModeChip();
  $('#pageTitle').textContent = (M.title && M.title()) || MENU_BY[ROUTE].label;
  $('#hdrExtra').innerHTML = M.hdr ? M.hdr() : '';
  const same = lastRenderedRoute === ROUTE, y = window.scrollY;
  $('#view').innerHTML = M.render();
  if(M.after) M.after();
  window.scrollTo(0, same ? y : 0);
  lastRenderedRoute = ROUTE;

MOD.presence = {

  },
  onkeydown(e){ if(e.key === 'Enter' && e.target.dataset.pmsg !== undefined){ e.target.blur(); $('[data-act="savemsg"]').click(); } }
};

const HOLIDAYS = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날','2026-03-01':'삼일절','2026-03-02':'대체공휴일',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일',
  '2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석',
  '2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-03-01':'삼일절','2027-05-05':'어린이날',
  '2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-08-15':'광복절','2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석',
  '2027-10-03':'개천절','2027-10-09':'한글날','2027-12-25':'성탄절'
};
const LAB_CATS = { '랩미팅':'#4f46e5', '세미나':'#0891b2', '행사':'#db2777', '출장':'#0d9488', '휴가':'#9ca3af', '마감':'#dc2626', '기타':'#6b7280' };
const PERSONAL_CATS = ['약속','수업','회의','연구','실무','실험실','출장','휴가','개인','기타'];
const Cal = {
  month: todayStr().slice(0, 7),
  f: (() => { try{ return Object.assign({ lab:true, shared:true, mine:true, dl:true, resv:false, pl:true, g:true }, JSON.parse(localStorage.getItem('labhub-calf') || '{}')); }catch(e){ return { lab:true, shared:true, mine:true, dl:true, resv:false, pl:true }; } })(),
  saveF(){ try{ localStorage.setItem('labhub-calf', JSON.stringify(this.f)); }catch(e){} },
  occ(ev, from, to){
    const out = []; const dur = Math.max(0, diffDays(ev.end || ev.start, ev.start));
    if(ev.repeat === 'weekly'){
      const until = ev.repeatUntil && ev.repeatUntil < to ? ev.repeatUntil : to;
      let s = ev.start;
      if(s < from){ const k = Math.floor(diffDays(from, s) / 7); s = addDays(s, Math.max(0, k - 1) * 7); }
      for(let g = 0; s <= until && g < 600; s = addDays(s, 7), g++){ const e = addDays(s, dur); if(e >= from) out.push({ s, e }); }
    }else{ const e = addDays(ev.start, dur); if(e >= from && ev.start <= to) out.push({ s: ev.start, e }); }
    return out;
  },
  color(ev){ return ev.type === 'lab' ? (LAB_CATS[ev.cat] || '#4f46e5') : personColor(ev.ownerName || userName(ev.uid)); },
  visible(ev){
    if(this.f.onlyMe && !(ev.uid === ME.uid && ev.type === 'personal') && !(ev.attendees || []).includes(ME.name)) return false;
    if(PREVIEW && ev.visibility === 'private') return false;
    if(ev.type === 'lab') return this.f.lab;
    if(ev.uid === ME.uid) return this.f.mine;
    return this.f.shared;
  },
  timeLabel(ev){ return ev.allDay || !ev.startTime ? '종일' : ev.startTime + (ev.endTime ? '–' + ev.endTime : ''); },
  /* 날짜별 항목 */
  byDay(from, to, all){
    const map = {};
    const push = (d, it) => { (map[d] = map[d] || []).push(it); };
    if((all || this.f.pl) && !this.f.onlyLabView) for(const it of Planner.mine()){
      if(it.kind === 'todo'){ if(it.dueDate && it.dueDate >= from && it.dueDate <= to) push(it.dueDate, { kind:'pl', pl:it, title:'☑ ' + it.title, color: Planner.color(it.cat), timeLabel:'내 할 일 기한', sortKey:'3', done: it.done }); continue; }
      if(!it.date) continue; const e = it.endDate && it.endDate > it.date ? it.endDate : it.date;
      for(let d = it.date < from ? from : it.date, g = 0; d <= e && d <= to && g < 400; d = addDays(d, 1), g++)
        push(d, { kind:'pl', pl:it, title:'🔒 ' + it.title, color: Planner.color(it.cat), timeLabel: it.allDay || !it.start ? '종일' : it.start + (it.end ? '–' + it.end : ''), sortKey: (it.allDay || !it.start ? '0' : '1' + it.start), done: it.done });
    }
    if(all || this.f.g) for(const it of GCal.visible(from, to)){
      const e = Planner.endOf(it);
      for(let d = it.date < from ? from : it.date, g = 0; d <= e && d <= to && g < 400; d = addDays(d, 1), g++)
        push(d, { kind:'pl', pl:it, title:'G ' + it.title, color:'#4285f4', timeLabel: it.allDay || !it.start ? '종일' : it.start + (it.end ? '–' + it.end : ''), sortKey: (it.allDay || !it.start ? '0' : '1' + it.start) });
    }
    for(const ev of vals(S.events)){
      if(!all && !this.visible(ev)) continue;
      if(PREVIEW && ev.visibility === 'private') continue;
      for(const o of this.occ(ev, from, to)){
        for(let d = o.s < from ? from : o.s, g = 0; d <= o.e && d <= to && g < 400; d = addDays(d, 1), g++){
          push(d, { kind:'event', ev, title: (ev.type === 'personal' ? (ev.visibility === 'private' ? '🔒 ' : '') + (ev.uid === ME.uid ? '' : '[' + (ev.ownerName || userName(ev.uid)) + '] ') : '') + ev.title, who: ev.attendees || [], mine: (ev.attendees || []).includes(ME.name),
                    color: this.color(ev), timeLabel: this.timeLabel(ev), sortKey: (ev.allDay || !ev.startTime ? '0' : '1' + ev.startTime) });
        }
      }
    }
    if(all || this.f.dl) for(const d of vals(S.deadlines)) if(d.date >= from && d.date <= to)
      push(d.date, { kind:'dl', dl:d, title:'⏰ ' + d.title, color: Deadline.isDone(d) ? '#9ca3af' : '#dc2626', timeLabel: d.time || '마감', sortKey:'2' });
    if(all || this.f.resv) for(const r of vals(S.reservations)) if(r.date >= from && r.date <= to)
      push(r.date, { kind:'resv', r, title:'🔧 ' + ((S.equipment[r.equipId] || {}).name || '장비') + ' · ' + r.userName, color:'#64748b', timeLabel: r.start + '–' + r.end, sortKey:'1' + r.start });
    const isLab = o => o.kind === 'event' && o.ev.type === 'lab';
    for(const d in map) map[d].sort((a, b) => (isLab(b) - isLab(a)) || a.sortKey.localeCompare(b.sortKey));
    return map;
  },
  items(from, to){ const m = this.byDay(from, to, true); return Object.keys(m).sort().flatMap(d => m[d]); },
  dot(o){ return '<i style="width:8px;height:8px;border-radius:50%;background:' + o.color + ';flex-shrink:0;display:inline-block"></i>'; },
  chip(o){
    const attr = o.kind === 'event' ? 'data-evid="' + o.ev.id + '"' : o.kind === 'dl' ? 'data-dl="' + o.dl.id + '"' : o.kind === 'pl' ? 'data-pl="' + o.pl.id + '"' : 'data-go="equipment"';
    const lab = o.kind === 'event' && o.ev.type === 'lab';
    return '<span class="ev' + (lab ? ' lab' : ' sub') + (o.done ? ' done' : '') + '" ' + attr + ' style="' + (lab ? 'background:' + o.color + ';border-left-color:' + o.color : 'background:' + o.color + '1c;border-left-color:' + o.color + ';color:#22263a') + '" title=""' + esc(o.timeLabel + ' ' + o.title + (o.who && o.who.length ? ' — 참여: ' + o.who.join(', ') : '')) + '">' +
      (o.kind === 'event' && o.timeLabel !== '종일' ? '<b style="font-weight:700;color:' + o.color + '">' + o.timeLabel.slice(0, 5) + '</b> ' : '') + (o.mine ? '<b title="내가 참여">●</b> ' : '') + esc(o.title) + (o.who && o.who.length ? ' <span style="opacity:.65;font-weight:500">· ' + esc(this.whoShort(o.who)) + '</span>' : '') + '</span>';
  },
  whoShort(a){ return a.length <= 3 ? a.join(', ') : a.slice(0, 2).join(', ') + ' 외 ' + (a.length - 2) + '명'; },
  who(o){ return o.who && o.who.length ? '<span class="s" title="' + esc(o.who.join(', ')) + '" style="display:inline-flex;gap:2px;align-items:center">' + o.who.slice(0, 5).map(n => avatar(n, personColor(n), 'sm')).join('') + (o.who.length > 5 ? '+' + (o.who.length - 5) : '') + '</span>' : ''; },

      body: '<div class="prewrap">' + '📅 ' + fmtDateLong(ev.start) + (ev.end && ev.end !== ev.start ? ' ~ ' + fmtDateLong(ev.end) : '') + ' · ' + this.timeLabel(ev) +
        (ev.repeat === 'weekly' ? '\n🔁 매주 반복' + (ev.repeatUntil ? ' (~' + ev.repeatUntil + ')' : '') : '') +
        (ev.attendees && ev.attendees.length ? '\n👥 참여: ' + esc(ev.attendees.join(', ')) : '') +
        (ev.location ? '\n📍 ' + esc(ev.location) : '') + (ev.memo ? '\n\n' + linkify(ev.memo) : '') + '</div>' });
  },
  edit(id, date){
    const ev = id ? S.events[id] : { title:'', type: canEdit('calendar') ? 'lab' : 'personal', visibility:'shared', cat: canEdit('calendar') ? '랩미팅' : '약속', allDay:false,

      '<div data-vis><label class="fl">공개 범위</label><select name="visibility">' + opt('shared', '공유 — 구성원 모두 볼 수 있음', ev.visibility) + opt('private', '비밀 — 나만 볼 수 있음', ev.visibility) + '</select></div>' +
      fld('분류', '<select name="cat">' + catOpts(ev.type, ev.cat) + '</select>') +
      '<div><label class="fl">&nbsp;</label><label class="chk"><input type="checkbox" name="allDay"' + (ev.allDay ? ' checked' : '') + '> 종일</label></div>' +
      fld('시작일', '<input type="date" name="start" value="' + esc(ev.start) + '">') + fld('종료일', '<input type="date" name="end" value="' + esc(ev.end || ev.start) + '">') +

      fld('반복', '<select name="repeat">' + opt('none', '반복 안 함', ev.repeat) + opt('weekly', '매주', ev.repeat) + '</select>') +

    const start = addDays(ymd(first), -first.getDay());
    const end = addDays(start, 41);
    const map = Cal.byDay(start, end, false);
    const t = todayStr();
    const F = [['lab','연구실 일정'],['mine','내 개인 일정'],['shared','구성원 공유 일정'],['pl','☑ 내 할 일']].concat(GCal.on() ? [['g','G 구글 캘린더']] : []).concat([['dl','마감'],['resv','장비 예약'],['onlyMe','● 내가 참여하는 것만']]);
    let h = '<div class="toolbar"><button class="btn small" data-act="prev">‹</button><button class="btn small" data-act="today">오늘</button><button class="btn small" data-act="next">›</button>' +
      '<b style="font-size:16px;margin:0 6px">' + y + '년 ' + m + '월</b><span class="sp"></span><div class="cal-legend">' +
      F.map(([k, l]) => '<span class="chip sel' + (Cal.f[k] ? ' on' : '') + '" data-f="' + k + '">' + l + '</span>').join('') + '</div></div>';
    h += '<div class="cal"><div class="cal-head">' + DOW.map(d => '<div>' + d + '</div>').join('') + '</div><div class="cal-grid">';
    for(let i = 0; i < 42; i++){
      const d = addDays(start, i); const dd = parseYmd(d);
      const items = map[d] || [];
      const cls = ['cal-day', dd.getMonth() !== m - 1 ? 'other' : '', d === t ? 'today' : '', dd.getDay() === 0 || HOLIDAYS[d] ? 'sun' : '', dd.getDay() === 6 ? 'sat' : ''].join(' ');
      h += '<div class="' + cls + '" data-day="' + d + '"><span class="dn">' + dd.getDate() + '</span>' + (HOLIDAYS[d] ? '<span class="hol">' + HOLIDAYS[d] + '</span>' : '') +
        items.slice(0, 4).map(o => Cal.chip(o)).join('') + (items.length > 4 ? '<span class="ev more">+' + (items.length - 4) + '개 더</span>' : '') + '</div>';
    }
    h += '</div></div>';
    /* 다가오는 일정 */
    const up = Cal.byDay(t, addDays(t, 13), false);
    const days = Object.keys(up).sort();
    h += '<div class="card" style="margin-top:18px"><h3>다가오는 2주</h3>' + (days.length ? days.map(d =>
      '<div style="margin-bottom:8px"><div class="small" style="font-weight:800;color:' + (d === t ? 'var(--accent)' : 'var(--muted)') + ';margin:6px 0 2px">' + fmtDate(d) + (d === t ? ' · 오늘' : '') + '</div><div class="list">' +
      up[d].map(o => '<div class="li click" ' + (o.kind === 'event' ? 'data-evid="' + o.ev.id + '"' : o.kind === 'dl' ? 'data-dl="' + o.dl.id + '"' : o.kind === 'pl' ? 'data-pl="' + o.pl.id + '"' : '') + '>' + Cal.dot(o) + '<span class="t">' + esc(o.title) + '</span>' + Cal.who(o) + '<span class="s">' + esc(o.timeLabel) + '</span></div>').join('') + '</div></div>').join('')
      : '<div class="hint">예정된 일정이 없습니다.</div>') + '</div>';
    if(!PREVIEW && isMember()) h += '<div class="card" style="margin-top:18px"><h3>✅ 내 할 일 <span class="muted small" style="font-weight:500">나만 보임 · 기한이 있으면 달력에 ☑ 로 표시</span><button class="more" data-padd="todo">＋ 할 일</button></h3>' + Planner.todosHTML() + '</div>';
    h += '<div class="hint" style="margin-top:6px">🔒 비밀 일정은 본인에게만 보입니다 (관리자도, 참여 인원으로 넣은 사람도 볼 수 없음). 연구실 일정은 색이 채워진 막대로 맨 위에, 개인 일정은 연한 색으로 그 아래에 표시됩니다. 위쪽 칩으로 연구실 일정 / 내 개인 일정 / 공유 일정을 따로 켜고 끌 수 있습니다. ● 표시는 내가 참여 인원에 들어 있는 일정입니다. 날짜 칸을 누르면 그날 일정을 보고 추가할 수 있습니다.' + (GCal.err ? ' <span style="color:var(--danger)">구글 동기화 오류: ' + esc(GCal.err) + '</span>' : '') + '</div>' +
      (!PREVIEW && canAct() ? '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn small" data-act="gset">구글 캘린더 연동 설정</button><button class="btn small" data-act="pimport" title="예전 민호 플래너/내 플래너 내보내기 파일(JSON)을 개인 일정(비밀)과 내 할 일로 가져옵니다">플래너 파일 가져오기</button></div>' : '');
    return h;
  },
  onclick(e){
    const pa = e.target.closest('[data-padd]'); if(pa) return Planner.edit(null, null, 'todo');
    const row = e.target.closest('.pl-item');
    if(row){
      const it = S.planner[row.dataset.pid]; if(!it) return;
      if(e.target.closest('[data-ptoggle]')){ if(!canActPlanner()) return; it.done = !it.done; dbUpdate('planner', it.id, { done: it.done, uid: ME.uid }); return render(); }
      if(e.target.closest('[data-popen]')) return Planner.edit(it);
      return;
    }
    const a = e.target.closest('[data-act]');
    if(a){
      const act = a.dataset.act;
      if(act === 'new') return Cal.edit(null, todayStr());
      if(act === 'gset') return GCal.modal();
      if(act === 'gsync') return GCal.on() && GCal.clientId() ? GCal.sync(true) : GCal.modal();
      if(act === 'pimport') return pickJSONFile().then(o => Planner.importData(o)).catch(err => toast(err.message, true));
      const [y, m] = Cal.month.split('-').map(Number);
      if(act === 'prev') Cal.month = ymd(new Date(y, m - 2, 1)).slice(0, 7);
      if(act === 'next') Cal.month = ymd(new Date(y, m, 1)).slice(0, 7);
      if(act === 'today') Cal.month = todayStr().slice(0, 7);
      return render();
    }
    const f = e.target.closest('[data-f]'); if(f){ Cal.f[f.dataset.f] = !Cal.f[f.dataset.f]; Cal.saveF(); return render(); }
    const ev = e.target.closest('[data-evid]'); if(ev) return Cal.openEvent(ev.dataset.evid);
    const dl = e.target.closest('[data-dl]'); if(dl) return Deadline.edit(dl.dataset.dl);
    const pli = e.target.closest('[data-pl]'); if(pli) return Planner.edit(Planner.get(pli.dataset.pl));
    if(e.target.closest('[data-go]')) return;
    const day = e.target.closest('[data-day]'); if(day) return Cal.dayModal(day.dataset.day);
  }
};

const TT_DAYS = ['월','화','수','목','금'];
const TT_KINDS = { meet:'미팅', class:'수업', lab:'랩미팅', etc:'기타' };
const TT = {
  cur: null, sel: [], free: false, edit: false,
  list(){ return vals(S.timetables).sort((a, b) => String(b.id).localeCompare(String(a.id))); },
  current(){ const l = this.list(); const pref = this.cur || (S.app && S.app.semester); return l.find(t => t.id === pref) || l[0] || null; },
  pIndex(t, k){ return t.periods.findIndex(p => p.k === k); },
  blockAt(t, d, colk, pi){
    return (t.blocks || []).find(b => b.day === d && (b.col === colk || b.col === 'all') && this.pIndex(t, b.from) <= pi && pi <= this.pIndex(t, b.to));
  },
  names(t, d, colk, pk){ return (t.cells || {})[d + '|' + colk + '|' + pk] || []; },
  match(cellName, person){ return cellName === person || cellName.startsWith(person + '(') || cellName.startsWith(person + ' '); },
  todayIdx(){ const g = new Date().getDay(); return g >= 1 && g <= 5 ? g - 1 : -1; },
  nowPeriod(t){ const n = nowHM(); return t.periods.findIndex(p => p.s <= n && n < p.e); },
  isProf(name){ const r = roster().find(x => x.name === name); return r && r.group === '교수'; },
  /* 특정 칸(요일·교시)에서 이 사람이 바쁜가 */
  personBusy(t, d, pi, person){
    const pk = t.periods[pi].k;
    if((t.blocks || []).some(b => b.day === d && b.col === 'all' && this.pIndex(t, b.from) <= pi && pi <= this.pIndex(t, b.to))) return true;
    if(person === '교수님' || this.isProf(person)){
      if(this.blockAt(t, d, 'prof', pi)) return true;
      if(this.names(t, d, 'prof', pk).length) return true;
      if(person === '교수님') return false;
    }
    const listed = t.cols.some(c => this.names(t, d, c.k, pk).some(n => this.match(n, person)));
    return t.namesAreFree ? !listed : listed;
  },
  myToday(){
    const t = this.current(); if(!t) return null;
    const d = this.todayIdx(); if(d < 0) return [];
    const out = []; const prof = this.isProf(ME.name);
    t.periods.forEach((p, pi) => {
      const allB = (t.blocks || []).find(b => b.day === d && b.col === 'all' && this.pIndex(t, b.from) <= pi && pi <= this.pIndex(t, b.to));
      if(allB) return out.push({ k:p.k, s:p.s, e:p.e, what: allB.label.replace(/\n/g, ' ') });
      if(prof){ const b = this.blockAt(t, d, 'prof', pi); if(b) return out.push({ k:p.k, s:p.s, e:p.e, what: b.label.replace(/\n/g, ' ') }); }
      for(const c of t.cols){
        const n = this.names(t, d, c.k, p.k).find(x => this.match(x, ME.name));
        if(n) return out.push({ k:p.k, s:p.s, e:p.e, what: (t.busyLabel || '수업') + (n !== ME.name ? ' ' + n.slice(ME.name.length) : '') });
      }
    });
    return out;
  },
  busyNow(name){
    const t = this.current(); if(!t || t.namesAreFree) return null;
    const d = this.todayIdx(); if(d < 0) return null;
    const pi = this.nowPeriod(t); if(pi < 0) return null;
    const p = t.periods[pi];
    const allB = (t.blocks || []).find(b => b.day === d && b.col === 'all' && this.pIndex(t, b.from) <= pi && pi <= this.pIndex(t, b.to));
    if(allB) return p.k + '교시 ' + allB.label.replace(/\n/g, ' ');
    if(this.isProf(name)){ const b = this.blockAt(t, d, 'prof', pi); if(b) return p.k + '교시 ' + b.label.replace(/\n/g, ' '); }
    if(t.cols.some(c => this.names(t, d, c.k, p.k).some(n => this.match(n, name)))) return p.k + '교시 ' + (t.busyLabel || '수업') + ' 중';
    return null;
  },
  save(t){ const d = clone(t); delete d.id; d.updatedAt = Date.now(); d.updatedBy = ME.name; return dbSet('timetables', t.id, d); },
  blank(id, name){
    return { id, name, busyLabel:'수업', namesAreFree:false,
      periods:[['A','09:00','10:15'],['B','10:30','11:45'],['C','12:00','13:15'],['D','13:30','14:45'],['E','15:00','16:15'],['F','16:30','17:45'],['G','18:00','19:15'],['H','19:30','20:45']].map(([k, s, e]) => ({ k, s, e })),
      cols:[{ k:'prof', label:'교수님' }, { k:'grad', label:'대학원생' }, { k:'ug', label:'학부생' }], cells:{}, blocks:[] };
  }
};
MOD.timetable = {
  hdr(){
    const l = TT.list(); if(!l.length) return '';
    const t = TT.current();
    return '<select data-sem>' + l.map(x => opt(x.id, x.name || x.id, t && t.id)).join('') + '</select>' +
      (canEdit('timetable') ? '<button class="btn small' + (TT.edit ? ' primary' : '') + '" data-act="edit">' + (TT.edit ? '편집 완료' : '✎ 편집 모드') + '</button>' : '');
  },
  render(){
    const t = TT.current();
    if(!t) return '<div class="empty">아직 시간표가 없습니다.' + (canEdit('timetable') ? '<div style="margin-top:12px;display:flex;gap:8px;justify-content:center"><button class="btn primary" data-act="newblank">빈 시간표 만들기</button>' + (isAdmin() ? '<button class="btn" data-go="backup">초기 데이터 불러오기</button>' : '') + '</div>' : '') + '</div>';
    const profs = rosterNames(['교수']);
    const people = Array.from(new Set((profs.length ? profs : ['교수님']).concat(rosterNames(['대학원생','학부생','기타']))));
    const tIdx = TT.todayIdx(), nowP = TT.nowPeriod(t);
    let h = '<div class="toolbar"><span class="small muted" style="font-weight:700">사람 선택</span>' +
      people.map(n => '<span class="chip sel' + (TT.sel.includes(n) ? ' on' : '') + '" data-person="' + esc(n) + '">' + esc(n) + '</span>').join('') +
      '<span class="sp"></span><button class="btn small" data-act="me">나만</button><button class="btn small' + (TT.free ? ' primary' : '') + '" data-act="free">🔎 빈 시간 찾기</button>' +
      (TT.sel.length ? '<button class="btn small" data-act="clear">선택 해제</button>' : '') + '</div>';
    if(TT.free) h += '<div class="alert info">' + (TT.sel.length ? '선택한 ' + TT.sel.length + '명(' + esc(TT.sel.join(', ')) + ')이 <b>모두 비어 있는 시간</b>이 초록색으로 표시됩니다.' : '위에서 사람을 선택하면 모두가 비어 있는 시간을 찾아줍니다.') + '</div>';
    if(TT.edit) h += '<div class="alert warn">편집 모드 — 이름 칸을 누르면 이름을 고치고, 색 블록을 누르면 블록을 수정합니다.<button class="btn small" data-act="addblock">＋ 블록 추가</button><button class="btn small" data-act="settings">교시·설정</button><button class="btn small" data-act="sems">학기 관리</button></div>';
    const cols = t.cols, nc = cols.length;
    h += '<div class="tt-wrap"><div class="tt" style="grid-template-columns:70px repeat(' + (5 * nc) + ',1fr)">';
    h += '<div class="h" style="grid-column:1;grid-row:1 / span 2;display:flex;align-items:center;justify-content:center">시간</div>';
    TT_DAYS.forEach((d, di) => {
      h += '<div class="h' + (di === tIdx ? ' today' : '') + '" style="grid-column:' + (2 + di * nc) + ' / span ' + nc + ';grid-row:1">' + d + '</div>';
      cols.forEach((c, ci) => { h += '<div class="sh ' + c.k + '" style="grid-column:' + (2 + di * nc + ci) + ';grid-row:2">' + esc(c.label) + '</div>'; });
    });
    t.periods.forEach((p, pi) => {
      const row = 3 + pi;
      h += '<div class="ph' + (pi === nowP && tIdx >= 0 ? ' now' : '') + '" style="grid-column:1;grid-row:' + row + '"><b>' + esc(p.k) + '</b><span>' + p.s + '</span><span>' + p.e + '</span></div>';
      TT_DAYS.forEach((_, di) => {
        let slotCls = '';
        if(TT.free && TT.sel.length) slotCls = TT.sel.some(n => TT.personBusy(t, di, pi, n)) ? ' busy' : ' free';

        cols.forEach((c, ci) => {
          const b = TT.blockAt(t, di, c.k, pi);
          const col = 2 + di * nc + ci;
          if(b){
            if(TT.pIndex(t, b.from) === pi && !drawn.has(b.id)){
              drawn.add(b.id);
              const span = TT.pIndex(t, b.to) - TT.pIndex(t, b.from) + 1;
              const isAll = b.col === 'all';
              const isNow = di === tIdx && TT.pIndex(t, b.from) <= nowP && nowP <= TT.pIndex(t, b.to);
              h += '<div class="blk ' + (b.kind || 'etc') + (isNow ? ' now' : '') + (TT.edit ? ' edit' : '') + slotCls + '" data-blk="' + b.id + '" style="grid-column:' + (isAll ? (2 + di * nc) + ' / span ' + nc : col) + ';grid-row:' + row + ' / span ' + span + '">' + esc(b.label) + '</div>';

    return h;
  },
  onchange(e){ if(e.target.dataset.sem !== undefined){ TT.cur = e.target.value; render(); } },

        { label:'취소' },
