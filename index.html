/* =================================================================
   마감 트래커 (논문·학회·과제)
   ================================================================= */
const DL_KINDS = ['논문 투고','학회 초록','학회 발표','과제 보고서','과제 제안서','특허','졸업·학사','기타'];
const DL_STATUS = ['준비중','작성중','제출완료','결과대기','종료'];
const Deadline = {
  view: 'open', kind: '',
  isDone(d){ return d.status === '제출완료' || d.status === '종료' || d.status === '결과대기'; },
  edit(id){
    const d = id ? S.deadlines[id] : { title:'', kind:'논문 투고', date: addDays(todayStr(), 14), time:'', owners:[ME.name], status:'준비중', link:'', memo:'' };
    if(!d) return;
    const ro = !canEdit('deadlines');
    openModal({ title: id ? (ro ? d.title : '마감 수정') : '마감 추가', wide:true,
      body: '<div class="form">' + fld('제목', '<input name="title" value="' + esc(d.title) + '" placeholder="예: IROS 2027 full paper">', true) +
        fld('종류', '<select name="kind">' + DL_KINDS.map(k => opt(k, k, d.kind)).join('') + '</select>') +
        fld('상태', '<select name="status">' + DL_STATUS.map(k => opt(k, k, d.status)).join('') + '</select>') +
        fld('마감일', '<input type="date" name="date" value="' + esc(d.date) + '">') +
        fld('마감 시각 (선택, 예: 23:59 AoE)', '<input name="time" value="' + esc(d.time || '') + '">') +
        '<div class="full"><label class="fl">담당자</label>' + namePicker('owners', d.owners || []) + '</div>' +
        fld('링크 (투고 사이트·공고 등)', '<input name="link" value="' + esc(d.link || '') + '">', true) +
        fld('메모', '<textarea name="memo">' + esc(d.memo || '') + '</textarea>', true) + '</div>',
      onMount: (el) => { if(ro) $$('input,select,textarea', el).forEach(x => x.disabled = true); },
      buttons: ro ? [{ label:'닫기' }] : [
        id ? { label:'삭제', cls:'ghost-danger', left:true, confirm:'이 마감 항목을 삭제할까요?', onClick: () => dbDel('deadlines', id) } : null,
        id ? { label:'🏆 성과로 등록', left:true, onClick: () => { setTimeout(() => Ach.edit(null, { title: d.title, type: /특허/.test(d.kind) ? '특허' : /학회/.test(d.kind) ? '학회 발표' : /논문/.test(d.kind) ? '논문' : '기타', date: d.date, authors: (d.owners || []).join(', '), link: d.link || '' }), 0); } } : null,
        { label:'취소' },
        { label:'저장', cls:'primary', onClick: (m) => {
          const f = readForm(m.el);
          if(!f.title || !f.date){ toast('제목과 마감일을 입력하세요', true); return false; }
          const data = Object.assign({}, id ? d : { createdAt: Date.now(), createdBy: ME.name }, f, { updatedAt: Date.now() });
          delete data.id; dbSet('deadlines', id || newId(), data);
        } } ] });
  }
};
MOD.deadlines = {
  hdr(){ return canEdit('deadlines') ? '<button class="btn primary small" data-act="new">＋ 마감 추가</button>' : ''; },
  render(){
    const t = todayStr();
    let list = vals(S.deadlines);
    if(Deadline.view === 'open') list = list.filter(d => !Deadline.isDone(d));
    if(Deadline.view === 'mine') list = list.filter(d => (d.owners || []).includes(ME.name));
    if(Deadline.view === 'done') list = list.filter(d => Deadline.isDone(d));
    if(Deadline.kind) list = list.filter(d => d.kind === Deadline.kind);
    list.sort((a, b) => Deadline.view === 'done' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    let h = '<div class="toolbar"><div class="seg">' + [['open','진행 중'],['mine','내 담당'],['done','제출·종료'],['all','전체']].map(([k, l]) => '<button data-view="' + k + '" class="' + (Deadline.view === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
      '<select data-kind><option value="">모든 종류</option>' + DL_KINDS.map(k => opt(k, k, Deadline.kind)).join('') + '</select></div>';
    if(!list.length) return h + '<div class="empty">표시할 항목이 없습니다.' + (canEdit('deadlines') ? ' 오른쪽 위 [＋ 마감 추가]로 등록하세요.' : '') + '</div>';
    h += '<div class="card tbl-wrap" style="padding:6px 10px"><table class="tbl"><thead><tr><th>D-day</th><th>마감일</th><th>제목</th><th>종류</th><th>담당</th><th>상태</th><th></th></tr></thead><tbody>';
    for(const d of list){
      const i = ddayInfo(d.date, Deadline.isDone(d));
      h += '<tr class="click" data-dl="' + d.id + '"><td><span class="dday ' + i.cls + '">' + i.label + '</span></td><td class="nowrap">' + fmtDate(d.date) + (d.time ? ' <span class="muted small">' + esc(d.time) + '</span>' : '') + '</td>' +
        '<td><b>' + esc(d.title) + '</b>' + (d.memo ? '<div class="muted small" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.memo) + '</div>' : '') + '</td>' +
        '<td><span class="chip">' + esc(d.kind) + '</span></td><td>' + (d.owners || []).map(n => '<span title="' + esc(n) + '">' + avatar(n, personColor(n), 'sm') + '</span>').join(' ') + '</td>' +
        '<td>' + (canEdit('deadlines') ? '<select data-status="' + d.id + '">' + DL_STATUS.map(k => opt(k, k, d.status)).join('') + '</select>' : '<span class="chip ' + (Deadline.isDone(d) ? 'ok' : 'accent') + '">' + esc(d.status) + '</span>') + '</td>' +
        '<td>' + (safeUrl(d.link) ? '<a href="' + esc(safeUrl(d.link)) + '" target="_blank" rel="noopener" data-stop>🔗</a>' : '') + '</td></tr>';
    }
    return h + '</tbody></table></div>';
  },
  onclick(e){
    if(e.target.closest('[data-stop]') || e.target.closest('select')) return;
    const a = e.target.closest('[data-act="new"]'); if(a) return Deadline.edit(null);
    const v = e.target.closest('[data-view]'); if(v){ Deadline.view = v.dataset.view; return render(); }
    const r = e.target.closest('[data-dl]'); if(r) Deadline.edit(r.dataset.dl);
  },
  onchange(e){
    if(e.target.dataset.kind !== undefined){ Deadline.kind = e.target.value; return render(); }
    const s = e.target.dataset.status;
    if(s){ const d = S.deadlines[s]; d.status = e.target.value; dbUpdate('deadlines', s, { status: d.status, updatedAt: Date.now() }); setTimeout(render, 50); }
  }
};

      if(act === 'advance'){ const names = Minutes.nextPresenters(); p.history = (p.history || []).concat({ date: todayStr(), names }).slice(-40); p.idx = (p.idx + (p.per || 1)) % p.order.length; Minutes.savePres(p); return render(); }
      if(act === 'back'){ p.idx = (p.idx - (p.per || 1) + p.order.length * 5) % p.order.length; Minutes.savePres(p); return render(); }
      if(act === 'shuffle'){ for(let i = p.order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [p.order[i], p.order[j]] = [p.order[j], p.order[i]]; } p.idx = 0; Minutes.savePres(p); return render(); }
      if(act === 'hclear'){ confirmBox('발표 기록 ' + (p.history || []).length + '건을 모두 삭제할까요? (발표 순서는 그대로 유지됩니다)', '전체 삭제', true).then(ok => { if(ok){ p.history = []; Minutes.savePres(p); render(); } }); return; }
      if(act === 'fillgrad'){ rosterNames(['대학원생']).forEach(n => { if(!p.order.includes(n)) p.order.push(n); }); Minutes.savePres(p); return render(); }
    }
    const hd = e.target.closest('[data-hdel]');
    if(hd && canEdit('minutes')){ p.history = (p.history || []).slice(); p.history.splice(Number(hd.dataset.hdel), 1); Minutes.savePres(p); return render(); }
    const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]'), rm = e.target.closest('[data-rm]'), si = e.target.closest('[data-setidx]');
    if(up || dn){ const i = Number((up || dn).dataset[up ? 'up' : 'down']); const j = i + (up ? -1 : 1); if(j < 0 || j >= p.order.length) return; [p.order[i], p.order[j]] = [p.order[j], p.order[i]]; Minutes.savePres(p); return render(); }
    if(rm){ const i = Number(rm.dataset.rm); p.order.splice(i, 1); if(p.idx >= p.order.length) p.idx = 0; Minutes.savePres(p); return render(); }
    if(si){ p.idx = Number(si.dataset.setidx); Minutes.savePres(p); return render(); }
    const r = e.target.closest('[data-min]'); if(r) return Minutes.view(r.dataset.min);
  },
  onchange(e){
    const p = Minutes.pres();
    if(e.target.dataset.addp !== undefined && e.target.value){ p.order.push(e.target.value); Minutes.savePres(p); return render(); }
    if(e.target.dataset.per !== undefined){ p.per = Number(e.target.value); Minutes.savePres(p); return render(); }
  },
  oninput(e){ if(e.target.dataset.q !== undefined){ Minutes.q = e.target.value; clearTimeout(this._t); this._t = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = $('[data-q]'); if(i){ i.focus(); i.setSelectionRange(pos, pos); } }, 250); } }
};

const BACKUP_COLLS = { users:'구성원 계정', notices:'공지사항', noticeComments:'공지 댓글', events:'일정', timetables:'시간표', deadlines:'마감 트래커',
  fundProjects:'연구비 과제', fundBatches:'연구비 신청차수', equipment:'장비', reservations:'장비 예약', supplies:'소모품', purchases:'구매 요청', suggestions:'건의사항', achievements:'연구 성과', directory:'연락처·링크·라이선스', settings:'설정(명단·권한·발표순서)' };
const Backup = {
  build(){
    const data = {};
    for(const c in BACKUP_COLLS){
      if(c === 'settings'){ data.settings = {}; if(S.app) data.settings.app = clone(S.app); if(S.presentation) data.settings.presentation = clone(S.presentation); continue; }
      data[c] = {};
      for(const id in S[c]){ const d = clone(S[c][id]); delete d.id; data[c][id] = d; }
    }
    return { format:'labhub-backup', version:1, exportedAt: new Date().toISOString(), exportedBy: ME.name, labName: (S.app && S.app.labName) || '', data };
  },
  async withFiles(obj){
    const files = {};
    const metas = await BE.list('fundFiles');
    for(const m of metas){
      const chunks = await BE.list('fundFiles/' + m.id + '/c');
      files[m.id] = { meta: m.data, chunks: Object.fromEntries(chunks.map(c => [c.id, c.data])) };
    }
    obj.files = files; return obj;
  },
  stamp(){ const d = new Date(); return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()); },
  async download(withFiles){
    let obj = this.build();
    if(withFiles && MODE === 'fire'){ toast('첨부파일을 모으는 중…'); obj = await this.withFiles(obj); }
    downloadFile(((S.app && S.app.labName) || '연구실') + '_전체백업_' + this.stamp() + '.json', JSON.stringify(obj));
    dbSet('settings', 'app', { lastBackupAt: Date.now(), lastBackupBy: ME.name }, true);
    toast('백업 파일을 내려받았습니다');
  },
  summary(obj){ return Object.keys(obj.data || {}).map(c => [c, Object.keys(obj.data[c] || {}).length]).filter(x => BACKUP_COLLS[x[0]]); },
  restoreDialog(obj){

  /* 자동 스냅샷: 관리자가 접속하면 하루 한 번 이 브라우저(IndexedDB)에 저장, 최근 14개 보관 */
  idb(){ return new Promise((res, rej) => { const r = indexedDB.open('labhub-snapshots', 1); r.onupgradeneeded = () => r.result.createObjectStore('snap'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async snapList(){
    try{ const db = await this.idb(); return await new Promise((res, rej) => { const out = []; const tx = db.transaction('snap', 'readonly'); const c = tx.objectStore('snap').openCursor();
      c.onsuccess = () => { const cur = c.result; if(cur){ out.push({ key: cur.key, size: cur.value.length }); cur.continue(); } else res(out.sort((a, b) => b.key.localeCompare(a.key))); }; c.onerror = () => rej(c.error); }); }
    catch(e){ return []; }
  },
  async snapGet(k){ const db = await this.idb(); return new Promise((res, rej) => { const q = db.transaction('snap', 'readonly').objectStore('snap').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async autoSnapshot(force){
    if(!isAdmin() || !APP_STARTED) return;
    try{
      const key = (MODE === 'demo' ? 'demo_' : '') + todayStr();
      const list = await this.snapList();
      if(!force && list.some(x => x.key === key)) return;
      const json = JSON.stringify(this.build());
      const db = await this.idb();
      await new Promise((res, rej) => { const tx = db.transaction('snap', 'readwrite'); const st = tx.objectStore('snap'); st.put(json, key);
        list.filter(x => x.key !== key).slice(13).forEach(x => st.delete(x.key)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      if(ROUTE === 'backup') render();
    }catch(e){ console.warn('snapshot failed', e); }
  }
};

/* =================================================================
   연구비 지급신청 (기존 프로그램 이식)
   - 과제(fundProjects)·신청차수(fundBatches)를 문서 단위로 저장
   - 바뀐 문서만 서버로 보내므로 여러 명이 동시에 다른 차수를 편집해도 충돌이 적음
   ================================================================= */
const Fund = (() => {
  const BUDGET_ITEMS = ['연구재료비','연구실운영비','회의비','출장비','연구인력지원비','소프트웨어 활용비'];
  let state = null;                 /* { projects:[], batches:[] } */
  let saved = {};                   /* 'p:id' | 'b:id' → 마지막으로 서버와 맞춘 JSON */
  let flushT = null;
  const ui = { view:'all', monthFilter:null, projTab:{}, collapsed:{} };
  const SERVER_FILES = () => MODE === 'fire';
  const canEditF = () => canEdit('fund');
  const setStatus = (m, err) => setSaveStatus(m, err);
  const currentMonth = () => todayStr().slice(0, 7);
  const monthLabel = m => { if(!m) return '월 미지정'; const [y, mm] = m.split('-'); return y + '년 ' + Number(mm) + '월'; };
  const batchSum = b => (b.entries || []).reduce((a, e) => a + (Number(e.amount) || 0), 0);

  function ensure(){
    if(state) return;
    state = { projects:[], batches:[] }; saved = {};
    if(!ui.monthFilter) ui.monthFilter = currentMonth();
    syncFromS();
  }
  function mergeColl(prefix, store, arr){
    const ids = new Set(Object.keys(store));
    for(let i = arr.length - 1; i >= 0; i--){
      const k = prefix + ':' + arr[i].id;
      if(!ids.has(arr[i].id) && (k in saved)){ delete saved[k]; arr.splice(i, 1); }
    }
    for(const id of ids){
      const d = clone(store[id]); d.id = id;
      const j = stableJSON(d), k = prefix + ':' + id;
      if(saved[k] === j) continue;
      saved[k] = j;
      const idx = arr.findIndex(o => o.id === id);
      if(idx >= 0) arr[idx] = d; else arr.push(d);
    }
  }
  function syncFromS(){
    mergeColl('p', S.fundProjects, state.projects);
    mergeColl('b', S.fundBatches, state.batches);
    state.projects.sort((a, b) => (a.order || 0) - (b.order || 0));
  }
  function onRemote(){ if(state) syncFromS(); }
  function reset(){ state = null; saved = {}; clearTimeout(flushT); flushT = null; }
  function persist(){
    if(!canEditF()) return;
    setStatus('저장 대기…');
    clearTimeout(flushT); flushT = setTimeout(flush, 300);
  }
  function flush(){
    clearTimeout(flushT); flushT = null;
    if(!state || !canEditF()) return;
    const ops = [], seen = new Set();
    state.projects.forEach((p, i) => {
      p.order = i; const k = 'p:' + p.id; seen.add(k);
      const d = clone(p); const j = stableJSON(d);
      if(saved[k] !== j){ saved[k] = j; ops.push({ op:'set', coll:'fundProjects', id:p.id, data:d }); }
    });
    state.batches.forEach(b => {
      const k = 'b:' + b.id; seen.add(k);
      const d = clone(b); const j = stableJSON(d);
      if(saved[k] !== j){ saved[k] = j; ops.push({ op:'set', coll:'fundBatches', id:b.id, data:d }); }
    });
    for(const k of Object.keys(saved)) if(!seen.has(k)){ delete saved[k]; ops.push({ op:'del', coll: k[0] === 'p' ? 'fundProjects' : 'fundBatches', id: k.slice(2) }); }
    if(ops.length) dbBatch(ops).catch(() => {});
    else setStatus('저장됨');
  }
  window.addEventListener('beforeunload', () => { if(flushT) flush(); });

  function spentBy(projectId, item){
    let sum = 0;
    for(const b of state.batches){
      if(b.projectId !== projectId || b.rejected) continue;
      for(const e of (b.entries || [])) if(String(e.item || '').trim() === item) sum += Number(e.amount) || 0;
    }
    return sum;
  }
  function armDelete(btn, armedText){
    if(btn.dataset.armed === '1') return true;

      const meta = t.e.files[Number((o || dl).dataset[o ? 'aopen' : 'adl'])];
      try{
        setAttachMsg('불러오는 중…', true);
        const blob = await resolveAttachmentBlob(t.b, t.e, meta);
        if(!blob){ setAttachMsg('이 컴퓨터에 파일이 없고 서버에도 저장되어 있지 않습니다' + (meta.by ? ' (첨부한 사람: ' + meta.by + ')' : '') + '.', false); return; }
        const url = URL.createObjectURL(blob);
        if(o) window.open(url, '_blank'); else{ const a = document.createElement('a'); a.href = url; a.download = meta.name; a.click(); }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        setAttachMsg(o ? '' : '✓ 내려받았습니다.', true); refreshAttachModal();
      }catch(e){ setAttachMsg('실패: ' + errMsg(e), false); }
    }
    if(d && canEditF()){
      const idx = Number(d.dataset.adel); const meta = t.e.files[idx];
      const cands = meta ? [candidateRels(t.b, t.e, meta)] : [];
      t.e.files.splice(idx, 1); if(meta){ delLocalPath(meta.id); if(meta.hasRemote && SERVER_FILES()) deleteServerFile(meta.id); }
      persist(); refreshAttachModal(); setAttachMsg('첨부를 삭제했습니다.', true);
      await quarantineCands(cands); scheduleAutoTidy();
    }
  });

  let quickBusy = false;
  async function quickSave(md, keep){
    if(quickBusy) return false;
    const el = md.el; const { q, files, drawFiles, fillBatches } = el._q;
    const f = readForm($('.form', el));
    if(!f.desc){ toast('증빙내역을 입력하세요', true); q('desc').focus(); return false; }
    if(!f.item){ toast('예산비목을 입력하세요 (폴더 이름이 됩니다)', true); q('item').focus(); return false; }
    quickBusy = true;
    try{
      let b = f.batchId !== '__new' ? state.batches.find(x => x.id === f.batchId) : null;
      if(!b){
        b = newBatch(f.projectId, f.kind); b.entries = []; b.name = f.newName || b.name; b.month = f.newMonth || currentMonth();
        state.batches.push(b);
      }
      /* 새 차수에 자동으로 생긴 빈 줄은 정리 */
      b.entries = (b.entries || []).filter(x => x.desc || x.amount || x.date || x.item || (x.files && x.files.length));
      const e = Object.assign(newEntry(), { form: f.form, item: f.item, date: f.date, amount: parseAmount(f.amount), desc: f.desc, user: f.user, writer: f.writer });
      b.entries.push(e);
      toast('저장 중…');
      const notes = await attachFiles(b, e, files.map(x => x.file), files.map(x => x.kind));
      persist();
      try{ localStorage.setItem(QLAST_KEY, JSON.stringify({ projectId: f.projectId, kind: f.kind, batchId: b.id, item: f.item, form: f.form, user: f.user })); }catch(err){}
      ui.view = f.projectId; ui.projTab[f.projectId] = f.kind; if(ui.monthFilter !== 'all' && b.month) ui.monthFilter = b.month;
      toast(notes.length ? '등록했지만 일부 문제: ' + notes.join(' / ') : '✓ 등록했습니다' + (files.length ? ' — 파일 ' + files.length + '개 저장' : ''), !!notes.length);
      render();
      if(keep){
        files.length = 0; q('desc').value = ''; q('amount').value = ''; drawFiles();
        const lastSel = b.id; try{ const l = JSON.parse(localStorage.getItem(QLAST_KEY)); l.batchId = lastSel; }catch(err){}
        fillBatches(); q('batchId').value = b.id; q('batchId').dispatchEvent(new Event('change', { bubbles:true })); q('desc').focus();
      }
      return true;
    }catch(err){ toast('등록 실패: ' + errMsg(err), true); return false; }
    finally{ quickBusy = false; }
  }

  const suggBox = document.createElement('div'); suggBox.className = 'sugg-pop'; document.body.appendChild(suggBox);
  let suggTarget = null;
  function suggestionsFor(kind){
    if(kind !== 'item') return SUGGESTIONS[kind] || [];

    const out = (p && p.budgets) ? Object.keys(p.budgets) : [];

    if(input.disabled) return;
    const all = suggestionsFor(input.dataset.sugg); const q = input.value.trim();
    const list = q ? all.filter(o => o.includes(q)) : all;
    if(!list.length){ hideSugg(); return; }
    suggTarget = input;
    suggBox.innerHTML = list.map(o => '<div class="sugg-item">' + esc(o) + '</div>').join('');
    const r = input.getBoundingClientRect();
    suggBox.style.left = '-9999px'; suggBox.style.top = '-9999px'; suggBox.style.minWidth = r.width + 'px'; suggBox.classList.add('open');
    const bw = suggBox.offsetWidth, bh = suggBox.offsetHeight;
    let left = r.left; if(left + bw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - bw - 8);
    let top = r.bottom + 4; if(top + bh > window.innerHeight - 8) top = Math.max(8, r.top - bh - 4);
    suggBox.style.left = left + 'px'; suggBox.style.top = top + 'px';

  const legacyFileUrl = (url, room, id) => String(url).trim().replace(/\/+$/, '') + '/fund-files/' + String(room).trim().replace(/[^\w-]/g, '') + '/' + id + '.json';

    }

  }

    function isAdmin() { return role() == 'admin'; }
    function isMember() { return role() in ['admin', 'grad', 'intern', 'viewer']; }
    function canAct() { return role() in ['admin', 'grad', 'intern']; }
    function perms() {
      return exists(/databases/$(database)/documents/settings/app)
        ? get(/databases/$(database)/documents/settings/app).data.get('perms', {}) : {};
    }
    function canView(m) {
      return isAdmin() || (isMember() && role() in perms().get(m, {}).get('view', ['admin', 'grad', 'intern', 'viewer']));
    }
    function canEdit(m) {
      return isAdmin() || (canAct() && canView(m) && role() in perms().get(m, {}).get('edit', []));
    }
    function onlyChanged(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys); }
    function mine() { return request.resource.data.uid == request.auth.uid; }

    }
  }

   건의사항
   ================================================================= */
const SG_CATS = ['프로그램 개선','연구실 운영','장비·물품','기타'];
const SG_STATUS = ['접수','검토 중','반영','보류'];
const SG_CLS = { '접수':'accent', '검토 중':'warn', '반영':'ok', '보류':'' };
const Suggest = {
  f: 'open',
  author(x){ return x.anon ? '익명' : (x.authorName || ''); },
  mine(x){ return !x.anon && x.uid === ME.uid; },
  edit(id){
    const x = id ? S.suggestions[id] : { title:'', body:'', cat:'프로그램 개선', anon:false };
    openModal({ title: id ? '건의 수정' : '건의하기', wide:true, sticky:true,
      body: '<div class="form">' + fld('제목', '<input name="title" value="' + esc(x.title) + '">', true) +
        fld('분류', '<select name="cat">' + SG_CATS.map(c => opt(c, c, x.cat)).join('') + '</select>') +
        '<div></div>' +
        fld('내용', '<textarea name="body" style="min-height:180px" placeholder="무엇이 불편한지, 어떻게 바뀌면 좋을지 적어주세요">' + esc(x.body) + '</textarea>', true) + '</div>',
      buttons: [{ label:'취소' }, { label: id ? '저장' : '올리기', cls:'primary', onClick: (m) => {
        const f = readForm(m.el);
        if(!f.title){ toast('제목을 입력하세요', true); return false; }
        if(id){ dbUpdate('suggestions', id, { title: f.title, body: f.body, cat: f.cat, updatedAt: Date.now(), status: x.status, uid: x.uid }); return; }
        const data = { title: f.title, body: f.body, cat: f.cat, status:'접수', createdAt: Date.now(), likes: [], uid: ME.uid, authorName: ME.name };
        dbSet('suggestions', newId(), data);
      } }] });
  },
  view(id){
    const x = S.suggestions[id]; if(!x) return;
    const ed = canEdit('suggest'); const mine = this.mine(x) && x.status === '접수';
    openModal({ title: x.title, wide:true,
      sub: '<span class="chip">' + esc(x.cat || '') + '</span> <span class="chip ' + (SG_CLS[x.status] || '') + '">' + esc(x.status) + '</span> · ' + esc(this.author(x)) + ' · ' + fmtTs(x.createdAt) + ' · 공감 ' + (x.likes || []).length,
      body: '<div class="prewrap">' + linkify(x.body || '(내용 없음)') + '</div>' +
        (x.reply && !ed ? '<div class="card" style="box-shadow:none;background:#fafbfe;margin-top:16px"><b class="small">답변</b> <span class="muted small">' + esc(x.replyBy || '') + ' · ' + fmtTs(x.replyAt) + '</span><div class="prewrap" style="margin-top:6px">' + linkify(x.reply) + '</div></div>' : '') +
        (ed ? '<h4>답변 · 처리 상태</h4><div class="form">' + fld('상태', '<select name="status">' + SG_STATUS.map(c => opt(c, c, x.status)).join('') + '</select>') + '<div></div>' +
          fld('답변 (모두에게 보임)', '<textarea name="reply" style="min-height:110px">' + esc(x.reply || '') + '</textarea>', true) + '</div>' : ''),
      buttons: [ (ed || mine) ? { label:'삭제', cls:'ghost-danger', left:true, confirm:'이 건의를 삭제할까요?', onClick: () => dbDel('suggestions', id) } : null,
        mine ? { label:'수정', onClick: () => { setTimeout(() => Suggest.edit(id), 0); } } : null,
        { label:'닫기' },
        ed ? { label:'답변 저장', cls:'primary', onClick: (m) => { const f = readForm(m.el); const p = { status: f.status, reply: f.reply }; if(f.reply !== (x.reply || '')){ p.replyBy = ME.name; p.replyAt = Date.now(); } dbUpdate('suggestions', id, p); } } : null ] });
  }
};
MOD.suggest = {
  hdr(){ return canAct() ? '<button class="btn primary small" data-act="new">＋ 건의하기</button>' : ''; },
  render(){
    let list = vals(S.suggestions);
    if(Suggest.f === 'open') list = list.filter(x => x.status === '접수' || x.status === '검토 중');
    if(Suggest.f === 'done') list = list.filter(x => x.status === '반영' || x.status === '보류');
    if(Suggest.f === 'mine') list = list.filter(x => Suggest.mine(x));
    list.sort((a, b) => (b.likes || []).length - (a.likes || []).length || (b.createdAt || 0) - (a.createdAt || 0));
    let h = '<div class="toolbar"><div class="seg">' + [['open','진행 중'],['done','처리 완료'],['mine','내 글'],['all','전체']].map(([k, l]) => '<button data-sf="' + k + '" class="' + (Suggest.f === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
      '<span class="hint">공감이 많은 순으로 보입니다.</span></div>';
    if(!list.length) return h + '<div class="empty">건의사항이 없습니다.' + (canAct() ? ' 오른쪽 위 [＋ 건의하기]로 올려주세요.' : '') + '</div>';
    for(const x of list){
      const liked = (x.likes || []).includes(ME.uid);
      h += '<div class="notice" data-sg="' + x.id + '"><div style="display:flex;gap:12px;align-items:flex-start">' +
        '<button class="btn small' + (liked ? ' primary' : '') + '" data-like="' + x.id + '" style="flex-shrink:0;min-width:58px" title="공감">👍 ' + (x.likes || []).length + '</button>' +
        '<div style="min-width:0;flex:1"><div class="nt">' + esc(x.title) + ' <span class="chip">' + esc(x.cat || '') + '</span><span class="chip ' + (SG_CLS[x.status] || '') + '">' + esc(x.status) + '</span></div>' +
        '<div class="nm">' + esc(Suggest.author(x)) + ' · ' + fmtTs(x.createdAt) + '</div><div class="nb">' + esc(x.body || '') + '</div>' +
        (x.reply ? '<div class="small" style="margin-top:8px;padding:8px 11px;background:var(--accent-soft);border-radius:9px;color:#3730a3;white-space:pre-wrap;max-height:4.6em;overflow:hidden"><b>답변</b> ' + esc(x.reply) + '</div>' : '') +
        '</div></div></div>';
    }
    return h;
  },
  onclick(e){
    const a = e.target.closest('[data-act="new"]'); if(a) return Suggest.edit(null);
    const f = e.target.closest('[data-sf]'); if(f){ Suggest.f = f.dataset.sf; return render(); }
    const l = e.target.closest('[data-like]');
    if(l){
      const x = S.suggestions[l.dataset.like]; if(!x || !isMember()) return;
      const likes = (x.likes || []).includes(ME.uid) ? x.likes.filter(u => u !== ME.uid) : (x.likes || []).concat(ME.uid);
      x.likes = likes; BE.update('suggestions', x.id, { likes }).catch(err => toast(errMsg(err), true)); return render();
    }
    const s = e.target.closest('[data-sg]'); if(s) Suggest.view(s.dataset.sg);
  }
};

const ACH_TYPES = ['논문','학회 발표','특허','수상','기타'];
const ACH_STATUS = ['게재','게재 승인','심사 중','발표','출원','등록','수상','기타'];
const Ach = {
  type: '',
  hdr(){ return canEdit('deadlines') ? '<button class="btn primary small" data-act="achnew">＋ 성과 추가</button>' : ''; },
  line(x){ return '[' + x.type + '] ' + (x.authors ? x.authors + '. ' : '') + '"' + x.title + '"' + (x.venue ? ', ' + x.venue : '') + (x.date ? ', ' + String(x.date).slice(0, 7) : '') + (x.status ? ' (' + x.status + ')' : '') + '.'; },
  list(){ return vals(S.achievements).filter(x => !this.type || x.type === this.type).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); },
  render(){

    let h = '<div class="toolbar"><div class="seg"><button data-atype="" class="' + (!this.type ? 'on' : '') + '">전체</button>' + ACH_TYPES.map(t => '<button data-atype="' + t + '" class="' + (this.type === t ? 'on' : '') + '">' + t + '</button>').join('') + '</div><span class="sp"></span>' +

      return '<tr><td><b>' + lnk(x.url, x.title) + '</b></td><td class="nowrap">' + (x.expires ? esc(x.expires) + ' <span class="dday ' + d.cls + '">' + d.label + '</span>' : '<span class="muted">기한 없음</span>') + '</td><td class="nowrap">' + esc(x.owner || '') + '</td><td>' + esc(x.account || '') + '</td><td class="muted">' + esc(x.note || '') + '</td>' +
        '<td style="width:60px;text-align:right">' + (Dir.canE() ? '<button class="btn small" data-ditem="' + x.id + '">수정</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
    return h;
  },
  onclick(e){
    if(e.target.closest('[data-stop]')) return;
    const tb = e.target.closest('[data-dtab2]'); if(tb){ Dir.tab = tb.dataset.dtab2; Dir.q = ''; return render(); }
    const a = e.target.closest('[data-dact]');
    if(a){ const k = a.dataset.dact; if(k === 'me') return Dir.editContact('c_' + ME.uid); if(k === 'addc') return Dir.editContact(null); return Dir.editItem(Dir.tab, null); }
    const it = e.target.closest('[data-ditem]'); if(it) return Dir.editItem(Dir.tab, it.dataset.ditem);
    const r = e.target.closest('tr.click[data-dc]'); if(r) return Dir.editContact(r.dataset.dc);
  },
  oninput(e){ if(e.target.dataset.q !== undefined){ Dir.q = e.target.value; clearTimeout(this._t); this._t = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = $('#view [data-q]'); if(i){ i.focus(); i.setSelectionRange(pos, pos); } }, 250); } }
};

/* ---------------- 시작 ---------------- */
(function boot(){
  let cfg = FIREBASE_CONFIG;
  if(!cfg){ try{ cfg = JSON.parse(localStorage.getItem(LS_FBCFG) || 'null'); }catch(e){} }
  let mode = null;
  try{ mode = cfg ? 'fire' : (localStorage.getItem(LS_MODE) === 'demo' ? 'demo' : null); }catch(e){ mode = cfg ? 'fire' : null; }
  if(!mode) return showSetupChoice();
  initMode(mode, cfg);
})();

</script>
</body>
